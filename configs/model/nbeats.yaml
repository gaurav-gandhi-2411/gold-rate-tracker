# N-BEATS is trained UNIVARIATELY (target series only).
# This is a deliberate architectural choice — see docs/adr/007-nbeats-univariate-design.md.
# Do not add past_covariates or future_covariates here; if you want multivariate, that's TFT's job.
name: nbeats
_target_: ml.models.nbeats.NBeatsForecaster
params:
  input_chunk_length: 30
  output_chunk_length: 1
  generic_architecture: true
  num_stacks: 2
  num_blocks: 3
  num_layers: 4
  layer_widths: 128
  batch_size: 32
  n_epochs: 200
  optimizer_kwargs:
    lr: 0.0001
  loss_fn: l1
  random_state: 42
trainer:
  accelerator: gpu
  devices: 1
  precision: "16-mixed"
  enable_progress_bar: true
early_stopping:
  monitor: val_loss
  patience: 10
  min_delta: 0.0001
