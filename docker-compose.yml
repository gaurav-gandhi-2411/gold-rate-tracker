# Local development stack for gold-rate-tracker
# Currently: MLflow only. Future: could add monitoring (Grafana) or feature store.
#
# NOTE: Uses port 5001 (not 5000) to avoid conflicts if you run another MLflow
# instance (e.g., a separate project) simultaneously on this machine.
# Override: MLFLOW_PORT=5000 docker compose up -d
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    container_name: gold-mlflow
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    volumes:
      - ./mlruns:/mlruns
      - ./mlflow-db:/mlflow-db
    command: >
      mlflow server
        --backend-store-uri sqlite:////mlflow-db/mlflow.db
        --default-artifact-root /mlruns
        --host 0.0.0.0
        --port 5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
