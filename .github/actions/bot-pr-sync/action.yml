name: "Bot PR sync"
description: >
  Pushes the current HEAD commit (assumed already committed by the caller) to
  a reusable bot branch, opens/reuses a PR into master, dispatches lint.yml
  explicitly (a GITHUB_TOKEN-authored PR does not auto-trigger
  pull_request-triggered workflows), then polls the check-runs directly and
  merges once "lint" and "pwa-js" both succeed. Does not rely on
  `gh pr merge --auto`: GitHub's background auto-merge evaluator does not
  reliably re-trigger off check-suites created via workflow_dispatch
  (confirmed empirically — a PR sat at mergeable_state=blocked for 8+ minutes
  with both checks green and the branch up to date, then merged instantly via
  a direct merge call). Also resolves to an explicit PR number up front
  rather than re-resolving by branch name throughout: once this reusable
  branch has any merged/closed PR in its history, `gh pr view <branch>` keeps
  returning that stale PR, which made a later run falsely report success
  immediately (confirmed empirically — see the PR-lookup step below).
  Pushes/merges using the `token` input rather than GITHUB_TOKEN: branch
  protection blocks github-actions[bot]'s own merge even when required checks
  pass and the branch is up to date ("the base branch policy prohibits the
  merge", confirmed empirically — an identical merge from a user-authenticated
  session succeeds instantly). `token` must belong to a real user account
  (a PAT), not the default GITHUB_TOKEN.

inputs:
  branch:
    description: "Bot branch name to push to (reused across runs, force-pushed)"
    required: true
  pr-title:
    description: "Title for the PR if one needs to be created"
    required: true
  pr-body:
    description: "Body for the PR if one needs to be created"
    required: true
  token:
    description: >
      Token to push, open, and merge the PR with. Must be a PAT belonging to
      a real user account — GITHUB_TOKEN's actor (github-actions[bot]) is
      blocked from completing the merge by branch protection policy.
    required: true
  wait-minutes:
    description: "Max minutes to wait for the PR to merge before failing"
    required: false
    default: "15"

runs:
  using: composite
  steps:
    - name: Push, open/reuse PR, dispatch checks, and merge once green
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BRANCH: ${{ inputs.branch }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        WAIT_MINUTES: ${{ inputs.wait-minutes }}
      run: |
        set -e

        # Push/merge as a real user account (via GH_TOKEN, set from the
        # `token` input above) rather than GITHUB_TOKEN — required so the
        # merge itself is allowed (see the action description). As a likely
        # side effect this also makes lint.yml's pull_request trigger fire
        # naturally, since GITHUB_TOKEN-authored pushes are what don't
        # cascade into new workflow runs — a PAT-authored push isn't subject
        # to that suppression. The explicit `gh workflow run lint.yml` below
        # is kept until that's confirmed live; remove once verified redundant.
        git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

        # Rebase onto latest master first — master can move between this
        # job's checkout and this step, and a branch that starts behind can't
        # satisfy required-status-checks' "strict" rule even after checks pass.
        git fetch origin master
        git rebase origin/master
        git push --force origin "HEAD:refs/heads/${BRANCH}"

        # Resolve to an explicit PR NUMBER up front and use only that from
        # here on. `gh pr view <branch>` / `gh pr merge <branch>` resolve by
        # branch NAME, which is ambiguous once this reusable branch has any
        # merged/closed PR in its history — `gh pr view` happily returns that
        # stale PR (confirmed empirically: after bot/data-sync's first PR
        # #148 merged, a later run's `gh pr view bot/data-sync` still
        # returned #148 as MERGED, so the "does a PR exist" check thought one
        # already existed, never created a new one, and the poll loop saw
        # state=MERGED on the very first check — reporting success while that
        # run's actual commit sat on the branch, never opened as a PR, never
        # merged).
        PR_NUM=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${BRANCH}" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
        if [ -z "$PR_NUM" ]; then
          gh pr create --base master --head "${BRANCH}" --title "${PR_TITLE}" --body "${PR_BODY}"
          PR_NUM=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${BRANCH}" --state open --json number --jq '.[0].number')
        fi

        gh workflow run lint.yml --ref "${BRANCH}"

        ITERATIONS=$(( WAIT_MINUTES * 6 ))  # one iteration per 10s
        echo "Waiting up to ${WAIT_MINUTES} minutes for PR #${PR_NUM} (${BRANCH}) to pass checks and merge..."
        for i in $(seq 1 "${ITERATIONS}"); do
          PR_STATE=$(gh pr view "${PR_NUM}" --json state --jq '.state' 2>/dev/null || echo "UNKNOWN")
          if [ "$PR_STATE" = "MERGED" ]; then
            echo "Merged."
            exit 0
          fi
          if [ "$PR_STATE" = "CLOSED" ]; then
            echo "PR #${PR_NUM} was closed without merging — failing loudly."
            exit 1
          fi

          # master can also advance while we wait (another bot-sync PR
          # merging, or a human PR) — resync and re-dispatch since the new
          # merge-commit SHA starts with zero check runs.
          if [ $(( i % 2 )) -eq 0 ]; then
            MERGE_STATE=$(gh pr view "${PR_NUM}" --json mergeStateStatus --jq '.mergeStateStatus' 2>/dev/null || echo "UNKNOWN")
            if [ "$MERGE_STATE" = "BEHIND" ]; then
              echo "Branch fell behind master — resyncing via gh pr update-branch"
              gh pr update-branch "${PR_NUM}" || true
              sleep 5
              gh workflow run lint.yml --ref "${BRANCH}" || true
            fi
          fi

          CURRENT_SHA=$(gh pr view "${PR_NUM}" --json headRefOid --jq '.headRefOid' 2>/dev/null || echo "")
          if [ -n "$CURRENT_SHA" ]; then
            PASS_COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${CURRENT_SHA}/check-runs" \
              --jq '[.check_runs[] | select((.name=="lint" or .name=="pwa-js") and .conclusion=="success")] | length' 2>/dev/null || echo 0)
            if [ "$PASS_COUNT" -ge 2 ]; then
              echo "Checks green (${PASS_COUNT}) — attempting merge of PR #${PR_NUM}..."
              if gh pr merge "${PR_NUM}" --squash; then
                echo "Merged."
                exit 0
              else
                echo "Merge attempt failed (see error above) — will retry next poll."
              fi
            fi
          fi

          sleep 10
        done

        echo "Timed out after ${WAIT_MINUTES} minutes waiting for PR #${PR_NUM} (${BRANCH}) to merge (checks likely failing)."
        exit 1
