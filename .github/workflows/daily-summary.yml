name: Daily Gold Summary

on:
  schedule:
    - cron: "30 10 * * *"  # 10:30 UTC = 4:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-summary
  cancel-in-progress: false

jobs:
  summarize:
    # DEPRECATED: ml/daily_summary.py replaced by ml/notifications.py (PR G, 2026-05-19).
    # Job-level if: false skips the entire job (shows as "skipped" in Actions UI).
    # Entire workflow deleted in PR H alongside legacy LightGBM cleanup.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements.txt

      - name: Install ML dependencies
        run: pip install -q -r ml/requirements.txt

      - name: Run daily summary
        id: summary
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python ml/daily_summary.py

      - name: Alert on summary failure
        if: steps.summary.outcome == 'failure'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "${NTFY_TOPIC}" ] && echo "NTFY_TOPIC not set — skipping alert." && exit 0
          curl -s \
            -H "Title: Gold Tracker: Daily Summary Failed" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -d "Daily summary workflow failed. Check logs: ${RUN_URL}" \
            "https://ntfy.sh/${NTFY_TOPIC}" || true

      - name: Commit summary marker
        run: |
          git config user.name "gold-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/last_summary.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update daily summary marker [skip ci]"
            git pull --rebase origin master
            git push
          fi
