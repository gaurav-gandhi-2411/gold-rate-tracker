name: Generate OG Image

# Runs after each successful check-price run so og.png always reflects
# the latest price and verdict. The PNG is committed to the master branch
# at /og.png, which GitHub Pages serves at the root URL — that's the same
# path referenced in the og:image meta tag in index.html.
#
# Cache-busting: social platforms (Twitter, WhatsApp, Slack) cache OG images
# by URL. Because the URL is static (og.png), they re-fetch on their own
# schedule (typically every 7 days). Force a re-fetch on specific shares via
# Twitter Card Validator or Facebook Sharing Debugger.

# 2026-10-18: workflow_run does not fire for Check Gold Price runs that github-actions[bot] dispatched (0 of 85
# successful ones were followed by this workflow; every schedule/push/owner-dispatched run was). So
# scripts/bot_pr_merge.sh also dispatches this workflow after it merges a bot/data-sync PR (loop guard: this
# workflow's own bot/og-image PR never dispatches it); it commits nothing when og.png is unchanged.
# tests/test_workflow_run_chains.py fails a workflow_run chain that has no such dispatch path.
on:
  workflow_run:
    workflows: ["Check Gold Price"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: generate-og-image
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write # needed to open/auto-merge the og.png PR (master requires status checks)
  actions: write # needed to dispatch lint.yml explicitly (GITHUB_TOKEN pushes/PRs don't auto-trigger it)

jobs:
  generate:
    # Only run when the upstream workflow succeeded (a dispatch has no upstream)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      # the ops-log file append (scripts/ops_log.py) uses the workflow token, not a step's PAT
      OPS_LOG_TOKEN: ${{ github.token }}

    steps:
      # ref: master, not the event's commit. A workflow_run or dispatch event pins GITHUB_SHA to master
      # as it was when the event was created; the second run of a pair (the check-price workflow_run
      # plus bot_pr_merge.sh's dispatch) waits behind the first in the concurrency group, then rendered
      # from that stale master and collided with the og.png the first run had just merged: 62 of the
      # 69 failed runs in the 30 days to 2026-11-02 ("No commits between master and bot/og-image" 51,
      # og.png rebase conflict 11). From the tip, an unchanged card commits nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install --save-dev playwright
          npx playwright install chromium --with-deps

      - name: Serve site locally
        run: python3 -m http.server 8080 &

      - name: Wait for server
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:8080/og.html > /dev/null && break || sleep 1
          done

      - name: Screenshot OG page
        run: node scripts/screenshot-og.mjs http://localhost:8080

      # The sidecar data/og-card.json (what the card drew, for the hourly check in ci-health.yml) goes
      # in with og.png. It carries its build time, so on its own it always differs: it is committed
      # only with a changed og.png, or alone the first time, while master has none.
      - name: Commit og.png
        id: commit
        run: |
          set -e
          git config user.name  gold-rate-bot
          git config user.email gold-rate-bot@users.noreply.github.com
          git add og.png
          if ! git ls-files --error-unmatch data/og-card.json > /dev/null 2>&1; then
            git add data/og-card.json
          fi
          if git diff --cached --quiet; then
            echo "og.png unchanged, skipping commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add data/og-card.json
            git commit -m "chore: refresh OG image [skip ci]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync og.png via bot PR
        # Same protected-master gate as check-price.yml's data commit — see
        # the composite action for the full writeup.
        if: steps.commit.outputs.changed == 'true'
        uses: ./.github/actions/bot-pr-sync
        with:
          branch: bot/og-image
          pr-title: "chore: refresh OG image"
          pr-body: "Automated OG image refresh from run ${{ github.run_id }}."
          token: ${{ secrets.CI_MERGE_PAT }}
          wait-minutes: "10"
          ntfy-topic: ${{ secrets.NTFY_TOPIC }}

      # Ops-log entry on the second failure in a row, once, plus one recovery entry
      # (scripts/og_run_alert.py; no push since 2026-11-06). If the run history cannot be read, a
      # failure is recorded (fail closed).
      - name: Record in the ops log if the card keeps failing (once per incident, plus recovery)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/generate-og-image.yml/runs?status=completed&per_page=20" \
            --jq "{workflow_runs: [.workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | {id, conclusion}]}" \
            > "${RUNNER_TEMP}/og_runs.json" || rm -f "${RUNNER_TEMP}/og_runs.json"
          python3 scripts/og_run_alert.py --current "${JOB_STATUS}" --previous "${RUNNER_TEMP}/og_runs.json"
