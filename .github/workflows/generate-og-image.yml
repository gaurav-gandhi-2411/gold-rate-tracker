name: Generate OG Image

# Runs after each successful check-price run so og.png always reflects
# the latest price and verdict. The PNG is committed to the master branch
# at /og.png, which GitHub Pages serves at the root URL — that's the same
# path referenced in the og:image meta tag in index.html.
#
# Cache-busting: social platforms (Twitter, WhatsApp, Slack) cache OG images
# by URL. Because the URL is static (og.png), they re-fetch on their own
# schedule (typically every 7 days). Force a re-fetch on specific shares via
# Twitter Card Validator or Facebook Sharing Debugger.

on:
  workflow_run:
    workflows: ["Check Gold Price"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write # needed to open/auto-merge the og.png PR (master requires status checks)
  actions: write # needed to dispatch lint.yml explicitly (GITHUB_TOKEN pushes/PRs don't auto-trigger it)

jobs:
  generate:
    # Only run when the upstream workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install --save-dev playwright
          npx playwright install chromium --with-deps

      - name: Serve site locally
        run: python3 -m http.server 8080 &

      - name: Wait for server
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:8080/og.html > /dev/null && break || sleep 1
          done

      - name: Screenshot OG page
        run: node scripts/screenshot-og.mjs http://localhost:8080

      - name: Commit og.png
        # Same protected-master gate as check-price.yml's data commit (master
        # requires "lint"+"pwa-js" checks; a fresh commit can't have them
        # attached before a direct push is evaluated). Same fix: PR + explicit
        # lint.yml dispatch (workflow_dispatch is exempt from GITHUB_TOKEN's
        # cascade-trigger suppression) + auto-merge.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name  gold-rate-bot
          git config user.email gold-rate-bot@users.noreply.github.com
          git add og.png
          if git diff --cached --quiet; then
            echo "og.png unchanged, skipping commit"
            exit 0
          fi

          git commit -m "chore: refresh OG image [skip ci]"
          git push --force origin "HEAD:refs/heads/bot/og-image"

          if ! gh pr view bot/og-image --json number >/dev/null 2>&1; then
            gh pr create --base master --head bot/og-image \
              --title "chore: refresh OG image" \
              --body "Automated OG image refresh from run ${GITHUB_RUN_ID}. Auto-merges once lint + pwa-js pass."
          fi

          gh workflow run lint.yml --ref bot/og-image
          gh pr merge bot/og-image --auto --squash
