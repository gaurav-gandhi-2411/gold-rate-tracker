# The Monday gold-price summary to GG (docs/WEEKLY_ROUTINE.md section 7): the rates, the change, the week's
# high and low, the next range and the model's live accuracy. Owner decision 2026-11-06: ntfy carries
# gold-price information only, so the challengers, demotion state and dates go to the job summary instead.
# It still starts visitors-weekly.yml, which now only records a status word (no visitor numbers).
#
# Reads only files already in the repo (scripts/gg_digest.py). The schedule is a fallback only: every
# check-price run on a Monday after 03:30 UTC starts this when it has not run yet that day (the ci-health
# pattern), and a second run on the same day exits at the "already sent today" step.
name: Monday push

on:
  schedule:
    - cron: "35 3 * * 1" # Monday 09:05 IST, fallback only
  workflow_dispatch:

permissions:
  contents: read
  actions: write # starts visitors-weekly.yml

concurrency:
  group: monday-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Already sent today?
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/ci_retry.sh
          TODAY=$(date -u +%Y-%m-%d)
          N=$(ci_retry gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/monday-push.yml/runs?created=${TODAY}&status=success&per_page=50" \
                --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})] | length") || N=0
          echo "earlier successful runs today: ${N}"
          if [ "${N}" -gt 0 ]; then echo "send=false" >> "$GITHUB_OUTPUT"; else echo "send=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.send == 'true'
        with:
          python-version: "3.12"

      - name: Build the Monday note (system facts go to the job summary)
        if: steps.guard.outputs.send == 'true'
        run: python scripts/gg_digest.py monday --out "${RUNNER_TEMP}/monday.txt"

      - name: Send the gold-price note to GG's private topic
        if: steps.guard.outputs.send == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -u
          if [ -z "${NTFY_TOPIC}" ]; then
            echo "::error::NTFY_TOPIC is not set; nothing sent"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 \
            -H "Title: Gold Tracker: Monday gold summary" -H "Tags: moneybag" \
            --data-binary "@${RUNNER_TEMP}/monday.txt" "https://ntfy.sh/${NTFY_TOPIC}")
          echo "ntfy responded HTTP ${code}"
          [ "${code}" = "200" ]

      - name: Start the visitor-count check
        if: steps.guard.outputs.send == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/ci_retry.sh
          ci_retry gh workflow run visitors-weekly.yml --repo "${GITHUB_REPOSITORY}" --ref master
          echo "started visitors-weekly.yml"
