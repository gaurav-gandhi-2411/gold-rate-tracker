# Runs the pre-registered ADR 077 look at the beta 0.5 challenger (scripts/check_adr066_promotion.py
# --adr 077) on the runner, where DATA_ENC_KEY is available, because the shadow log is encrypted (ADR 060).
#
# Run it ONCE, unmodified, on the first Monday on or after 2026-12-14 on which a window meets both count
# gates and ADR 076's look of it has been taken: run adr076-look.yml FIRST; this workflow reads the list of
# its successful runs and keeps the look closed without one on or after ADR 076's look day
# (docs/adr/077-...). Before that, the script prints COUNTS
# ONLY and computes no effect size, interval or p-value of beta 0.5; it is safe to dispatch earlier to read
# the counts. It refuses to compute anything if the frozen rule in ml/hourly_beta05.py no longer hashes to
# the registered value. Its outcome on the look day is final.
#
# What it publishes: the script's console report only (aggregates, never entries). No artifact is
# uploaded and nothing is committed: the written report stays in the runner's temp dir.
#
# Read-only and manual: a pass only makes the challenger eligible for a code PR and a new ADR (ADR 077
# point 5); promotion goes through rule v7 and is GG's decision.
name: ADR 077 look (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read # lists the ADR 076 look runs

concurrency:
  group: adr077-look
  cancel-in-progress: false

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements-inference.lock

      - name: Install ML dependencies
        run: |
          pip install -q uv
          uv pip install --system \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r ml/requirements-inference.lock

      - name: Decrypt raw data files (ADR 060)
        uses: ./.github/actions/decrypt-data
        with:
          key: ${{ secrets.DATA_ENC_KEY }}

      # The evidence that ADR 076's look was taken: the times of its successful runs. Without this file
      # the script keeps the ADR 077 look closed.
      - name: List successful ADR 076 look runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/ci_retry.sh
          ci_retry gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/adr076-look.yml/runs?status=success&branch=master&per_page=100" \
            --jq '[.workflow_runs[].created_at]' > "${RUNNER_TEMP}/adr076_runs.json"

      - name: Run the ADR 077 look
        # --out-dir is outside the workspace and is never uploaded; only the console report is kept.
        run: python scripts/check_adr066_promotion.py --adr 077 --adr076-runs "${RUNNER_TEMP}/adr076_runs.json" --out-dir "${RUNNER_TEMP}/adr077_report"
