# Runs the pre-registered ADR 076 forward-only look (scripts/check_adr066_promotion.py --adr 076) on the
# runner, where DATA_ENC_KEY is available, because the shadow log is encrypted (ADR 060).
#
# Run it ONCE, unmodified, on the first Monday on or after 2026-11-16 (docs/adr/076-...). Before that
# date, or on any other weekday, the script prints COUNTS ONLY and computes no effect size, interval or
# p-value; it is safe to dispatch earlier to read the counts. Its outcome on the look day is final.
#
# What it publishes: the script's console report only (aggregates, never entries). No artifact is
# uploaded and nothing is committed: the written report stays in the runner's temp dir.
#
# Read-only and manual: the check never promotes anything (ADR 072 amendment is GG's decision).
name: ADR 076 look (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adr076-look
  cancel-in-progress: false

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements-inference.lock

      - name: Install ML dependencies
        run: |
          pip install -q uv
          uv pip install --system \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r ml/requirements-inference.lock

      - name: Decrypt raw data files (ADR 060)
        uses: ./.github/actions/decrypt-data
        with:
          key: ${{ secrets.DATA_ENC_KEY }}

      - name: Run the ADR 076 forward look
        # --out-dir is outside the workspace and is never uploaded; only the console report is kept.
        run: python scripts/check_adr066_promotion.py --adr 076 --out-dir "${RUNNER_TEMP}/adr076_report"
