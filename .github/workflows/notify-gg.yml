# Writes one entry to the ops log (job summary + ops-alert annotation); it sends NO push.
# Since 2026-11-06 ntfy carries gold-price information only, so "a PR needs GG's click" and dated
# outcomes go here and surface in the weekly report (python scripts/read_ops_log.py, see
# docs/WEEKLY_ROUTINE.md). The inputs are unchanged. They are public: PR link and plain words only.
name: Notify GG

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Notification title"
        required: true
        default: "needs your click"
      message:
        description: "Notification body (public: no secrets, links and plain words only)"
        required: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write # append one line to ops_log.jsonl on the ops-log branch (scripts/ops_log.py)
    env:
      # the ops-log file append (scripts/ops_log.py) uses the workflow token, not a step's PAT
      OPS_LOG_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Write the ops-log entry
        env:
          TITLE: ${{ inputs.title }}
          MESSAGE: ${{ inputs.message }}
        run: python3 scripts/ops_log.py --source "notify-gg" --title "${TITLE}" --body "${MESSAGE}"
