# Counts-only read of the encrypted IBJA store (ADR 060): rows, zero cells, null cells per column, and
# whether one named date's PM cells are null. Prints aggregates only, never a rate or a row.
#
# Standing data-validation rule (GG, 2026-11-15): zero cells must be 0. The script exits 1 when it is
# not. It only reads and prints (no commit, no artifact), so a red run here stops nothing else and
# needs no non-blocking soak; it runs weekly (Monday, after the Sunday backtest) and on demand.
name: IBJA store counts

on:
  schedule:
    - cron: "40 6 * * 1"
  workflow_dispatch:
    inputs:
      date:
        description: "ISO date whose PM cells are reported null/present (optional)"
        type: string
        default: "2026-11-10"

permissions:
  contents: read

concurrency:
  group: ibja-store-counts
  cancel-in-progress: false

jobs:
  counts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements-inference.lock

      - name: Install ML dependencies
        run: |
          pip install -q uv
          uv pip install --system \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r ml/requirements-inference.lock

      - name: Decrypt raw data files (ADR 060)
        uses: ./.github/actions/decrypt-data
        with:
          key: ${{ secrets.DATA_ENC_KEY }}

      - name: Count the IBJA store (aggregates only; zero cells must be 0)
        env:
          DAY: ${{ inputs.date || '2026-11-10' }}
        run: python scripts/ibja_store_counts.py --date "$DAY"
