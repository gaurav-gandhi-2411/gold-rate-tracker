# Runs the live-only monitor's simulation (scripts/simulate_live_monitor.py, ADR 075) on the runner,
# where DATA_ENC_KEY is available, because the model's retrospective record it resamples is
# encrypted (ADR 060) and the person running CC cannot decrypt it.
#
# What it publishes: the script's console output only, which is AGGREGATES (rates, ratios, counts).
# No artifact is uploaded and nothing is committed. The public repo's logs must never carry
# decrypted data; the script prints no price, date or per-day value.
#
# Read-only and manual. Fails (exit 1) when the frozen constants in ml/live_monitor.py differ from
# what the simulation calibrates, or a held-out proof fails.
name: Live monitor simulation (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-monitor-simulation
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements-inference.lock

      - name: Install ML dependencies
        run: |
          pip install -q uv
          uv pip install --system \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r ml/requirements-inference.lock

      - name: Decrypt raw data files (ADR 060)
        uses: ./.github/actions/decrypt-data
        with:
          key: ${{ secrets.DATA_ENC_KEY }}

      - name: Run the simulation (aggregates only on the console)
        run: python scripts/simulate_live_monitor.py
