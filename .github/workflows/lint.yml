name: Lint

on:
  push:
    branches: [main, master]
  # No `branches:` filter here (deliberately, unlike push above): a PR targeting any base
  # branch -- not just main/master -- must still get lint+pwa-js+dependency-audit+
  # sw-version-guard. Scoping this to [main, master] left both stacked PRs (base = a feature
  # branch, e.g. Waves-2/3 stacking pattern) and any long-stale PR whose base branch history
  # drifted with ZERO CI coverage -- required-checks-never-ran, not required-checks-failed,
  # which is a strictly worse failure mode: branch protection blocks the merge with an opaque
  # "2 of 2 required status checks are expected" and no actionable signal pointing at this
  # filter as the cause. Confirmed 2026-08-06: 10 PRs (#293-300, #459, #633) were stuck on
  # exactly this, unrelated to whether the PR was human- or Dependabot-authored -- both fire
  # `pull_request` normally once a synchronize event occurs, but master-targeting PRs that
  # simply sat too long without one never got a fresh check run against their current head
  # SHA. This trigger widening does not fix stale SHAs by itself (an update-branch/synchronize
  # is still needed once) but ensures no FUTURE PR, regardless of base branch, can end up
  # silently uncovered again.
  pull_request:
  # Daily backstop: GitHub Actions [skip ci] only suppresses push/pull_request events.
  # If a squash-merge commit carries [skip ci] in its body (e.g., a docs commit from
  # a PR branch), the push-triggered run is skipped. The schedule trigger runs regardless
  # of any commit message annotation, ensuring Lint always executes on master.
  # Bot cron commits (chronos probe, gold prices) still skip the push-triggered run as
  # intended — only the daily backstop catches any resulting drift.
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily (11:30 IST) — between bot cron windows
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install pre-commit
      - run: pre-commit run --all-files
      - name: Install ML dependencies
        run: pip install -q -r ml/requirements.txt
      - name: Run smoke tests
        run: pytest tests/test_inference_main.py -m smoke -v
      # Integration tests excluded here (norm #11): @pytest.mark.integration tests make
      # live network calls (HuggingFace model download). They run non-gating in
      # weekly-backtest.yml where the Chronos cache is warm and continue-on-error: true.
      - name: Run full pytest suite
        run: |
          pytest \
            -m "not integration" \
            tests/ -v
      - name: Check every JS test file is referenced by some workflow
        # AJ2 (production audit continuation, 2026-09-11/12): mechanical
        # version of the sweep that found test_tier_degradation_visible.js
        # and test_vol_regime.js silently never running in CI for 7-8 days.
        # Fails closed on any file present on disk but referenced by no
        # workflow and not in the script's own KNOWN_EXCLUSIONS -- see the
        # script's own module docstring for what "referenced" means and its
        # stated limitations.
        run: python scripts/check_test_registry_complete.py
      - name: Check no test file has lost tests (hollow-run guard)
        # AP5 (2026-09-21): a truncated test file produced a green, hollow run because the missing
        # tests were simply not collected. Fails if any file's test count falls below the committed
        # baseline (tests/test_count_baseline.json) or a test file is missing/unlisted. Lowering the
        # baseline is an explicit `--update`, visible in the PR diff. Limits: see the script docstring.
        run: python scripts/check_test_counts.py
      - name: Check plain-language compliance (U1/U3, docs/PLAIN_LANGUAGE_AUDIT.md)
        # Fails if a banned statistical/ML jargon term (coverage, n=, calibrated,
        # volatility, model, ...) appears in text an ordinary gold buyer would
        # actually read -- index.html, i18n.js, app.js, ml/public_copy.py,
        # README.md's first screen -- outside how-we-know.html, the designated
        # technical-detail page. See the script's own module docstring for the
        # exact scope per file and its stated blind spots.
        run: python scripts/check_plain_language.py
      - name: Check for hand-typed computed claims (accuracy/coverage/error)
        # Fails if user-facing text contains a hand-typed accuracy/coverage/error
        # claim as a literal digit ("N times out of M", "right N%", "coverage N%",
        # Hindi "N में से M बार", ...) instead of a value computed from data/*.json.
        # Scope differs from check_plain_language.py above: how-we-know.html IS
        # scanned here (a hand-typed number is a defect there too, unlike jargon).
        # See the script's own module docstring for exact scope, patterns, and
        # the ALLOWLIST mechanism for genuine non-claims.
        run: python scripts/check_computed_claims.py

  # PWA pure-function JS tests (app.js logic: comparisons, dedup, good-price,
  # scrape parsing, stale-banner, trend). These existed under tests/*.js but ran
  # in NO workflow — scraper-canary.yml only covers scraper/**.
  # This job closes that gap so app.js logic is gated on every push/PR.
  # Dep-free (node builtins + inlined functions); no npm install needed.
  # Scope of THIS job: the tests here exercise inlined COPIES of app.js functions
  # ("must match app.js"), not app.js itself, so a regression in app.js that a copy
  # doesn't reproduce is invisible to it -- verified 2026-09-21 by inverting isToday in
  # app.js: all 115 tests in this job still passed. The one test that drives the real
  # app.js (test_stale_banner_headless.js, needs Playwright + a browser) runs in the
  # separate `pwa-headless` job below.
  #
  # AJ2 (2026-09-11/12): test_tier_degradation_visible.js and
  # test_vol_regime.js added below -- both existed and passed locally since
  # PR #1358/#1340 respectively, but neither was ever added to this explicit
  # list, so neither ever ran in CI (7-8 days, silently). Found by
  # scripts/check_test_registry_complete.py (new step at the bottom of the
  # `lint` job, below) sweeping every JS test file against what this file
  # actually references -- that script now gates any FUTURE instance of this
  # exact gap.
  pwa-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Run PWA pure-function tests
        run: |
          node --test \
            tests/test_calculator.js \
            tests/test_calibration_confidence.js \
            tests/test_chart_cdn_resilience.js \
            tests/test_comparisons.js \
            tests/test_dedup.js \
            tests/test_feature_flags.js \
            tests/test_good_price.js \
            tests/test_pvalue_format.js \
            tests/test_scrape.js \
            tests/test_sentry_init.js \
            tests/test_stale_banner.js \
            tests/test_tier_degradation_visible.js \
            tests/test_vol_regime.js \
            scraper/test_retailer_enabled.mjs
      - name: Run dead-man's-switch Worker tests
        # Code-quality gate only -- this does NOT wire the switch's own
        # operation into GitHub Actions. It runs entirely on Cloudflare
        # Cron Triggers (see worker-deadman/README.md); this step only
        # lints/tests the source before it's deployed by hand.
        #
        # AI2 (production audit continuation, 2026-09-11/12): explicit file
        # list, not a glob -- deliberately, so a new test file added to
        # worker-deadman/test/ without also being added here is a visible,
        # reviewable diff line, not a silent CI gap. (A glob would have hidden
        # exactly the omission this comment now prevents: this line, before
        # this edit, ran only deadman.test.mjs and would have silently never
        # run pr_trigger_health.test.mjs.)
        run: node --test worker-deadman/test/deadman.test.mjs worker-deadman/test/pr_trigger_health.test.mjs

  # Drives the REAL app.js in headless Chromium (see the scope note on pwa-js above).
  # Deliberately not added to branch protection's required contexts -- changing the
  # required set is a separate, human decision. Same Node/Playwright setup as
  # render-smoke.yml (pinned action SHAs copied from there).
  pwa-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json
      - name: Install scraper dependencies (Playwright lives here)
        working-directory: scraper
        run: npm ci || npm install
      - name: Install Playwright browsers
        working-directory: scraper
        run: npx playwright install --with-deps chromium
      - name: Run the headless banner test against the real app.js
        run: node tests/test_stale_banner_headless.js
      - name: Run the service-worker offline data-fallback test
        run: node tests/test_sw_offline_headless.js
      - name: Run the feature-flag leak-detection headless test
        run: node tests/test_feature_flags_headless.js
      - name: Run the retailer-takedown fallback render test (ADR 059)
        run: node tests/test_retailer_takedown_headless.js

  # Forward lint+pwa-js's real result as commit statuses (bug #4, docs/RUNBOOK.md).
  # Branch protection's required_status_checks matches by context NAME across both
  # Check Runs and Commit Statuses — it doesn't care which API produced the match.
  # bot-pr-sync (CI_MERGE_PAT-authored pushes) dispatches this workflow via
  # workflow_dispatch rather than relying on the native pull_request trigger, and
  # workflow_dispatch-triggered check-runs were observed NOT reliably linking to the
  # PR for merge-eligibility purposes (intermittent, mechanism never fully confirmed —
  # see RUNBOOK). A commit status is SHA-scoped with no PR-linkage concept at all, so
  # it sidesteps that ambiguity entirely regardless of triggering event or webhook
  # delivery reliability. Runs on every trigger (push/pull_request/workflow_dispatch/
  # schedule) — harmless redundancy for normal PRs, load-bearing for bot ones.
  post-required-check-status:
    needs: [lint, pwa-js]
    if: needs.lint.result == 'success' && needs['pwa-js'].result == 'success'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Post lint + pwa-js as commit statuses on the head SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -e
          for CTX in lint pwa-js; do
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state=success \
              -f context="${CTX}" \
              -f description="Forwarded from run ${GITHUB_RUN_ID} (job result: success)" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          done

  # Enforces service-worker.js's own CACHE INVALIDATION CONTRACT: cache-first
  # shell serving means a client that already installed this SW never re-fetches
  # index.html/app.js/style.css/manifest.webmanifest unless service-worker.js's
  # own bytes change (which is what forces registration.update() to reinstall).
  # VERSION went unbumped for 11 merged PRs (2026-06-08 to 2026-07-19) before
  # this was added — returning visitors were frozen on a stale, drifted shell
  # with no error and no signal. This job fails fast the next time a shell file
  # changes without a VERSION bump instead of relying on someone remembering.
  sw-version-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a VERSION bump when shell assets change
        run: |
          set -e
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          # The guarded set is read from service-worker.js's own SHELL_FILES, not a
          # hand-typed regex: the old 4-file regex omitted i18n.js (precached
          # cache-first), so an i18n-only PR never demanded a VERSION bump. `set -e`
          # makes an unreadable/empty SHELL_FILES fail this step, not pass it.
          PRECACHED=$(python3 scripts/sw_shell_files.py)
          if echo "$CHANGED" | grep -qxF -f <(printf '%s\n' "$PRECACHED"); then
            if ! echo "$CHANGED" | grep -qx 'service-worker.js'; then
              echo "::error::a precached shell file (see scripts/sw_shell_files.py) changed but service-worker.js wasn't touched. Bump VERSION in service-worker.js — see the CACHE INVALIDATION CONTRACT comment at the top of that file."
              exit 1
            fi
            if ! git diff "$BASE...HEAD" -- service-worker.js | grep -q '^[+-]const VERSION'; then
              echo "::error::service-worker.js changed but the VERSION const wasn't. Bump VERSION — see the CACHE INVALIDATION CONTRACT comment at the top of that file."
              exit 1
            fi
          fi

  # X2 (audit 2026-09-05): PR #1393's un-reviewed threshold change reached
  # master anyway -- through PR #1394's squash-merge, because #1394's branch
  # was created without returning to master first, so its history included
  # #1393's commit as an ancestor. #1393 itself correctly showed as OPEN the
  # whole time; nothing detected the leak until it was found by chance.
  # Z1 (audit 2026-09-05): the original ancestry check (check_branch_base)
  # was pressure-tested with real scratch PRs and found unable to fire on
  # this exact incident shape -- a sibling branch's divergence point is
  # always trivially an ancestor of the base, by construction. Deleted and
  # replaced with two effect-based checks: does any commit unique to this
  # PR share exact patch content with a commit on ANY other open PR (no
  # label needed), and does every file in the full diff trace back to a
  # commit unique to this branch. The boundary-gated label overlap check is
  # kept as a supplementary signal on top. See
  # scripts/check_pr_boundary_leak.py's own docstring for the full mechanism
  # and its stated blind spots.
  boundary-leak-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check for foreign commits, unexplained file residue, and boundary-gated overlap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_pr_boundary_leak.py \
            --pr "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --base "${{ github.base_ref }}"

  # AF1 (audit 2026-09-10): mechanizes a rule that was written down after
  # PR #1353 (2026-09-04) and violated again by PR #1539 (2026-09-10) --
  # both widened a bot-pr-sync-calling workflow's `git add` list to include
  # README.md/docs/*.md without checking bot-pr-sync/action.yml's own
  # independent data-only allowlist first, and both blocked production data
  # sync for hours before being reverted (#1539 for 7+ hours, until
  # forecast.json's age reached 7.76h against the dead-man's-switch's 10h
  # WARN). A rule enforced only by a human remembering to read a guard
  # before touching the path it guards is not enforced -- this fails the PR
  # at review time instead. Deliberately NOT path-filtered to only
  # .github/workflows/** changes, unlike AF1's own originating instruction
  # -- this repo has its own documented incident (2026-08-06, PRs #293-300/
  # #459/#633) where path-filtering a required-adjacent check produced
  # "required check never ran" rather than "failed", a worse failure mode
  # than the extra few seconds this check costs on every PR. See
  # scripts/check_bot_pr_sync_allowlist.py's own docstring for the full
  # mechanism and its stated blind spots.
  bot-pr-sync-allowlist-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify every bot-pr-sync-calling workflow's git-add paths are allowlist-covered
        run: python scripts/check_bot_pr_sync_allowlist.py

  # GG spec, 2026-09-23: a passing ml.direction.gate decision must never
  # reach users without an explicit, GG-approved promotion record. Traced
  # end to end (docs/adr/036) and confirmed true today, but that's a fact
  # about the current code, not a structural guarantee -- this makes it one.
  # Deliberately NOT path-filtered (same AF1-incident reasoning as
  # bot-pr-sync-allowlist-check above): a required-adjacent check that only
  # runs on some paths can produce "never ran" instead of "failed", which is
  # worse than the few extra seconds of running it on every PR. See
  # scripts/check_direction_signal_not_wired_without_promotion.py's own
  # docstring for the full mechanism and its stated blind spots.
  direction-signal-promotion-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify no user-facing surface reads the direction gate without a promotion record
        run: python scripts/check_direction_signal_not_wired_without_promotion.py

  # Fail if any <!--METRIC:...--> marker in README.md/docs/*.md doesn't
  # resolve, or resolves to text that differs from what's committed --
  # same "regenerate, don't hand-edit" idiom as sw-version-guard above.
  # Three numbers were found hand-copied and stale before this existed
  # (R²=0.96, 97.3% coverage, direction-signal h1/h2 accuracy — 21-22 days
  # stale despite live sources existing for all three; session dated
  # 2026-08-27). See scripts/inject_metrics.py's module docstring for the
  # marker syntax and the FROZEN-block convention for numbers that must
  # NOT be auto-updated (ADR snapshots, the SHA-pinned backtest citation).
  docs-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Every METRIC marker must resolve and match committed text
        run: python scripts/inject_metrics.py --check

  # Dependency vulnerability audit — informational only, not a required check.
  # Neither lint nor pwa-js depends on this job; a finding here should not block
  # merges. Findings are surfaced in the job log for manual triage.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: pip-audit (ml/requirements-inference.lock)
        continue-on-error: true
        run: |
          pip install -q pip-audit
          pip-audit -r ml/requirements-inference.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: npm audit (scraper)
        continue-on-error: true
        working-directory: scraper
        run: npm audit --audit-level=high
