name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Daily backstop: GitHub Actions [skip ci] only suppresses push/pull_request events.
  # If a squash-merge commit carries [skip ci] in its body (e.g., a docs commit from
  # a PR branch), the push-triggered run is skipped. The schedule trigger runs regardless
  # of any commit message annotation, ensuring Lint always executes on master.
  # Bot cron commits (chronos probe, gold prices) still skip the push-triggered run as
  # intended — only the daily backstop catches any resulting drift.
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily (11:30 IST) — between bot cron windows
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pre-commit
      - run: pre-commit run --all-files
      - name: Install ML dependencies
        run: pip install -q -r ml/requirements.txt
      - name: Run smoke tests
        run: pytest tests/test_inference_main.py -m smoke -v
      # Training-deps tests (config, promotion, tracking, tuning) excluded — they need
      # hydra/mlflow/optuna which are training-only deps not in the inference lockfile.
      # A future CI job will run these with training deps installed.
      # Integration tests excluded here (norm #11): @pytest.mark.integration tests make
      # live network calls (HuggingFace model download). They run non-gating in
      # weekly-backtest.yml where the Chronos cache is warm and continue-on-error: true.
      - name: Run full pytest suite
        run: |
          pytest \
            --ignore=tests/test_config.py \
            --ignore=tests/test_promotion.py \
            --ignore=tests/test_tracking.py \
            --ignore=tests/test_tuning.py \
            -m "not integration" \
            tests/ -v

  # PWA pure-function JS tests (app.js logic: comparisons, dedup, good-price,
  # scrape parsing, stale-banner, trend). These existed under tests/*.js but ran
  # in NO workflow — scraper-canary.yml only covers scraper/**.
  # This job closes that gap so app.js logic is gated on every push/PR.
  # Dep-free (node builtins + inlined functions); no npm install needed.
  # test_stale_banner_headless.js is intentionally excluded — it needs Playwright
  # (imports scraper/node_modules/playwright); tracked as a follow-up.
  pwa-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Run PWA pure-function tests
        run: |
          node --test \
            tests/test_calculator.js \
            tests/test_comparisons.js \
            tests/test_dedup.js \
            tests/test_good_price.js \
            tests/test_scrape.js \
            tests/test_stale_banner.js \
            tests/test_trend.js

  # Dependency vulnerability audit — informational only, not a required check.
  # Neither lint nor pwa-js depends on this job; a finding here should not block
  # merges. Findings are surfaced in the job log for manual triage.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: pip-audit (ml/requirements.txt)
        continue-on-error: true
        run: |
          pip install -q pip-audit
          pip-audit -r ml/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: npm audit (scraper)
        continue-on-error: true
        working-directory: scraper
        run: npm audit --audit-level=high
