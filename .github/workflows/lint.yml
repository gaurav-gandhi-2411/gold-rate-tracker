name: Lint

on:
  push:
    branches: [main, master]
  # No `branches:` filter here (deliberately, unlike push above): a PR targeting any base
  # branch -- not just main/master -- must still get lint+pwa-js+dependency-audit+
  # sw-version-guard. Scoping this to [main, master] left both stacked PRs (base = a feature
  # branch, e.g. Waves-2/3 stacking pattern) and any long-stale PR whose base branch history
  # drifted with ZERO CI coverage -- required-checks-never-ran, not required-checks-failed,
  # which is a strictly worse failure mode: branch protection blocks the merge with an opaque
  # "2 of 2 required status checks are expected" and no actionable signal pointing at this
  # filter as the cause. Confirmed 2026-08-06: 10 PRs (#293-300, #459, #633) were stuck on
  # exactly this, unrelated to whether the PR was human- or Dependabot-authored -- both fire
  # `pull_request` normally once a synchronize event occurs, but master-targeting PRs that
  # simply sat too long without one never got a fresh check run against their current head
  # SHA. This trigger widening does not fix stale SHAs by itself (an update-branch/synchronize
  # is still needed once) but ensures no FUTURE PR, regardless of base branch, can end up
  # silently uncovered again.
  pull_request:
  # Daily backstop: GitHub Actions [skip ci] only suppresses push/pull_request events.
  # If a squash-merge commit carries [skip ci] in its body (e.g., a docs commit from
  # a PR branch), the push-triggered run is skipped. The schedule trigger runs regardless
  # of any commit message annotation, ensuring Lint always executes on master.
  # Bot cron commits (chronos probe, gold prices) still skip the push-triggered run as
  # intended — only the daily backstop catches any resulting drift.
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily (11:30 IST) — between bot cron windows
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Data-only or full, decided once here (GG 2026-10-30). Non-blocking: a failed, timed-out or
      # undecidable scope leaves data_only unset, which reads as full. Master is fetched into a
      # private ref (refs/ci-scope/master), not origin/master, and --refmap= stops git's
      # opportunistic origin/master update, so the steps below see the same
      # checkout as before. MASTER's copy of the scope script and of bot-pr-sync's allowlist,
      # never the PR's own. tests/test_lint_data_only_shadow.py runs this script on a real repo.
      - name: Scope -- data-only or full (master's scope script; undecidable is full)
        id: scope
        continue-on-error: true
        timeout-minutes: 3
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set +e
          MODE=full
          REASON="not a PR into master or a dispatched branch"
          HEAD=""
          if [ "$EVENT" = "pull_request" ] && [ "$BASE_REF" = "master" ]; then
            HEAD="$PR_HEAD"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$REF_NAME" != "master" ]; then
            HEAD="$GITHUB_SHA"
          fi
          if [ -n "$HEAD" ]; then
            echo "applies=true" >> "$GITHUB_OUTPUT"
            REASON="change list or master's scope script unavailable"
            # Three-dot (from the merge base), like GitHub's own PR file list: a two-dot diff against
            # a master that moved on would also list master's newer changes. No merge base within the
            # fetched depth -> git fails -> full.
            if git fetch -q --no-tags --refmap= --depth=100 origin "+refs/heads/master:refs/ci-scope/master" "$HEAD" \
              && git diff --name-status "refs/ci-scope/master...$HEAD" > "$RUNNER_TEMP/changes.txt" \
              && git show refs/ci-scope/master:scripts/ci_scope.py > "$RUNNER_TEMP/ci_scope.py" \
              && git show refs/ci-scope/master:.github/actions/bot-pr-sync/action.yml > "$RUNNER_TEMP/action.yml"; then
              if python "$RUNNER_TEMP/ci_scope.py" --changes "$RUNNER_TEMP/changes.txt" --action "$RUNNER_TEMP/action.yml" > "$RUNNER_TEMP/scope.txt"; then
                MODE=$(sed -n 's/^mode=//p' "$RUNNER_TEMP/scope.txt")
                REASON=$(sed -n 's/^reason: //p' "$RUNNER_TEMP/scope.txt" | head -n 1)
              else
                REASON="master's scope script failed to run"
              fi
            fi
          else
            echo "applies=false" >> "$GITHUB_OUTPUT"
          fi
          [ "$MODE" = "data-only" ] || MODE=full
          if [ "$MODE" = "data-only" ]; then DATA_ONLY=true; else DATA_ONLY=false; fi
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "data_only=$DATA_ONLY" >> "$GITHUB_OUTPUT"
          echo "SCOPE: mode=$MODE reason=$REASON"
          exit 0
      # Every install in a required job is pinned (brief 2026-10-30; tests/test_required_ci_installs_pinned.py):
      # an unpinned release must not be able to change what this job runs. Bumps are deliberate PRs.
      # CODE-ONLY steps below carry `if: ... data_only != 'true'`: they run on every run except one
      # the Scope step explicitly called data-only (GG 2026-10-30, option C; docs/RUNBOOK.md, "What
      # runs on a data-only PR"). A missing, failed or false scope output reads as full, so
      # undecidable means everything runs. tests/test_lint_data_only_switch.py classifies every step
      # of this job as always / code-only / data-only and fails on an unclassified one.
      - run: pip install pre-commit==4.7.0
        if: steps.scope.outputs.data_only != 'true'
      - run: pre-commit run --all-files
        if: steps.scope.outputs.data_only != 'true'
      # From here on, the suite tests what production runs (brief 2026-10-29): check-price's Python
      # (3.12, the version the lock is compiled for) and its exact install command. Until then this
      # job installed ml/requirements.txt and tested e.g. pandas 3.1.0 and torch 2.15 while
      # production ran the lock's 3.0.6 and 2.13. pre-commit above stays on 3.11, as its mypy hook
      # and pyproject's mypy target require. The newest allowed versions are tested by the
      # separate, non-required `newest-allowed-versions` job below.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ML dependencies
        # Must stay identical to check-price.yml's step of the same name (tests/test_check_installed_matches_lock.py).
        run: |
          pip install -q uv==0.13.6
          uv pip install --system \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r ml/requirements-inference.lock
      - name: Show installed versions
        # Informational, always exits 0; the next step is the strict proof.
        run: python scripts/print_runtime_versions.py --lock ml/requirements-inference.lock
      - name: Installed versions equal the lock
        # Every lock pin installed at exactly its version (a `+cpu` local label is noted, not failed).
        run: python scripts/check_installed_matches_lock.py
      - name: Run smoke tests
        if: steps.scope.outputs.data_only != 'true'
        run: pytest tests/test_inference_main.py -m smoke -v
      # Integration tests excluded here (norm #11): @pytest.mark.integration tests make
      # live network calls (HuggingFace model download). They run non-gating in
      # weekly-backtest.yml where the Chronos cache is warm and continue-on-error: true.
      - name: Run full pytest suite
        # Every non-data-only run (code PRs, pushes, the daily schedule, a failed or undecidable scope)
        # runs the whole suite exactly as before.
        if: steps.scope.outputs.data_only != 'true'
        run: |
          pytest \
            -m "not integration" \
            tests/ -v
      # Data-only PR (Scope said so), GG 2026-10-30 option C: the code cannot have changed, so the
      # deciding checks are the lock install and version proof above, this data validation, the
      # data-reading tests below, and the raw-data guard after them. Each fails the job.
      - name: Validate the data (scripts/validate_data.py) -- decides a data-only PR
        id: validate
        if: steps.scope.outputs.data_only == 'true'
        run: python scripts/validate_data.py
      - name: Run the tests that read data/ (data-only PR; selection fails closed to the full suite)
        id: data_tests
        if: steps.scope.outputs.data_only == 'true'
        # BLOCKING since 2026-11-14 (GG decision 2b). It ran report-only first (.claude/CLAUDE.md,
        # 2026-10-30): 101 clean data-only runs 2026-11-07..13 (data_tests=success in each decision
        # line), 0 false positives; the clock guard (tests/clock_guard.py) found no selected test that
        # depends on the hour or date. tests/test_lint_data_only_switch.py pins this state.
        # Selection = scripts/select_data_tests.py (static scan of tests/) UNION the committed
        # tests/data_reading_tests.txt (files measured reading data/ by scripts/data_reads_plugin.py).
        # No usable selection (script error, empty list) runs the FULL suite instead, never nothing.
        # Known blind spot: a NEW test file that reads data/ only through a module's default path is
        # in neither list until the measurement is refreshed (docs/RUNBOOK.md).
        run: |
          set +e
          SEL="$RUNNER_TEMP/data_test_files.txt"
          if python scripts/select_data_tests.py --measured tests/data_reading_tests.txt > "$SEL" && [ -s "$SEL" ]; then
            mapfile -t FILES < <(tr -d '\r' < "$SEL")
            echo "DATA TESTS: running ${#FILES[@]} selected test files"
            pytest -m "not integration" "${FILES[@]}" -v
          else
            echo "DATA TESTS: selection failed; running the FULL suite (fail closed)"
            pytest -m "not integration" tests/ -v
          fi
      - name: Check raw data stays encrypted (ADR 060)
        # No key needed. Fails if a registered raw-data path is tracked as plaintext once it has
        # ciphertext, is not gitignored, or if any data/encrypted/ file does not match its public
        # SHA-256 manifest entry. The key-leak and tamper tests are in tests/test_data_crypt.py.
        run: python scripts/data_crypt.py guard
      # GG decision 2c (2026-11-13): gitleaks and the 10 MB check no longer run on a data-only PR (no
      # pre-commit there), and the pre-commit gitleaks hook scans nothing in CI anyway (its entry is
      # `--staged`, a CI checkout has nothing staged). This scans the PR's own commits instead.
      # REPORT-ONLY until 5 clean real runs spanning >= 24 h (.claude/CLAUDE.md, 2026-10-30); the
      # flip is a separate PR that cites the run IDs and edits tests/test_pr_hygiene.py. The gitleaks
      # binary is the pinned release, SHA-256-checked against the value committed in
      # scripts/pr_hygiene_gitleaks.sha256 BEFORE it runs; a failed check never runs it.
      - name: "PR hygiene: secret scan + large files (report-only until 5 clean real runs over >= 24 h)"
        if: steps.scope.outputs.applies == 'true'
        continue-on-error: true
        timeout-minutes: 8
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          # same head as the Scope step: the PR head, or the dispatched commit
          HEAD="$GITHUB_SHA"
          [ "$EVENT" = "pull_request" ] && HEAD="$PR_HEAD"
          V=8.30.1
          D="$RUNNER_TEMP/gitleaks"
          mkdir -p "$D"
          BIN=""
          if curl -fsSL --retry 3 --max-time 120 -o "$D/gitleaks_${V}_linux_x64.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" \
            && (cd "$D" && sha256sum -c "$GITHUB_WORKSPACE/scripts/pr_hygiene_gitleaks.sha256") \
            && tar -xzf "$D/gitleaks_${V}_linux_x64.tar.gz" -C "$D" gitleaks; then
            BIN="$D/gitleaks"
          else
            echo "PR-HYGIENE: gitleaks download or checksum failed; the scan is not run"
          fi
          # a requested scan that has no verified binary must read could-not-verify, never skipped
          python scripts/pr_hygiene.py --changes "$RUNNER_TEMP/changes.txt" \
            --range "refs/ci-scope/master..$HEAD" --gitleaks "${BIN:-/nonexistent/gitleaks}" --max-kb 10240
          exit 0
      - name: Check every JS test file is referenced by some workflow
        if: steps.scope.outputs.data_only != 'true'
        # AJ2 (production audit continuation, 2026-09-11/12): mechanical
        # version of the sweep that found test_tier_degradation_visible.js
        # and test_vol_regime.js silently never running in CI for 7-8 days.
        # Fails closed on any file present on disk but referenced by no
        # workflow and not in the script's own KNOWN_EXCLUSIONS -- see the
        # script's own module docstring for what "referenced" means and its
        # stated limitations.
        run: python scripts/check_test_registry_complete.py
      - name: Check no test file has lost tests (hollow-run guard)
        if: steps.scope.outputs.data_only != 'true'
        # AP5 (2026-09-21): a truncated test file produced a green, hollow run because the missing
        # tests were simply not collected. Fails if any file's test count falls below the committed
        # baseline (tests/test_count_baseline/, one .count file per test file) or a test file is missing/unlisted. Lowering the
        # baseline is an explicit `--update`, visible in the PR diff. Limits: see the script docstring.
        run: python scripts/check_test_counts.py
      - name: Check plain-language compliance (U1/U3, docs/PLAIN_LANGUAGE_AUDIT.md)
        if: steps.scope.outputs.data_only != 'true'
        # Fails if a banned statistical/ML jargon term (coverage, n=, calibrated,
        # volatility, model, ...) appears in text an ordinary gold buyer would
        # actually read -- index.html, i18n.js, app.js, ml/public_copy.py,
        # README.md's first screen -- outside how-we-know.html, the designated
        # technical-detail page. See the script's own module docstring for the
        # exact scope per file and its stated blind spots.
        run: python scripts/check_plain_language.py
      - name: Retailer-language guard (ADR 059 -- no judgmental wording near a retailer name)
        if: steps.scope.outputs.data_only != 'true'
        run: python scripts/check_retailer_language.py
      - name: Check for hand-typed computed claims (accuracy/coverage/error)
        if: steps.scope.outputs.data_only != 'true'
        # Fails if user-facing text contains a hand-typed accuracy/coverage/error
        # claim as a literal digit ("N times out of M", "right N%", "coverage N%",
        # Hindi "N में से M बार", ...) instead of a value computed from data/*.json.
        # Scope differs from check_plain_language.py above: how-we-know.html IS
        # scanned here (a hand-typed number is a defect there too, unlike jargon).
        # See the script's own module docstring for exact scope, patterns, and
        # the ALLOWLIST mechanism for genuine non-claims.
        run: python scripts/check_computed_claims.py
      - name: Every .portfolio/metrics.json metric must have a committed artifact
        if: steps.scope.outputs.data_only != 'true'
        # Moved here from ci.yml (which triggered on `main` only, so it never ran: default branch
        # is master). A metric without a committed artifact behind it can silently drift from what
        # the portfolio site shows (2026-08-05 audit). Reads .portfolio/metrics.json + `git ls-files`.
        run: python scripts/check_manifest_provenance.py
      # One comparable line per run, so the data-only path stays measurable after the switch. Records
      # only (continue-on-error, exit 0): the deciding steps above are what fail the job. `scope=full`
      # lines show validate=skipped data_tests=skipped.
      - name: Data-only path (decision record) -- one line per run; records, never decides
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        env:
          APPLIES: ${{ steps.scope.outputs.applies }}
          DATA_ONLY: ${{ steps.scope.outputs.data_only }}
          SCOPE_REASON: ${{ steps.scope.outputs.reason }}
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          DATA_TESTS: ${{ steps.data_tests.outcome }}
          RESULT: ${{ job.status }}
        run: |
          set +e
          if [ "$APPLIES" = "false" ]; then
            echo "data-only record: not a PR into master or a dispatched branch; nothing to record"
            exit 0
          fi
          # only an explicit data_only=true from the Scope step is data-only; anything else is full
          if [ "$DATA_ONLY" = "true" ]; then MODE=data-only; else MODE=full; fi
          REASON="${SCOPE_REASON:-scope step did not finish (outcome: $SCOPE_OUTCOME)}"
          LINE="DATA-ONLY DECISION: scope=$MODE validate=$VALIDATE data_tests=$DATA_TESTS result=$RESULT reason=$REASON"
          echo "$LINE"
          if [ "$MODE" = "data-only" ] && [ "$DATA_TESTS" != "success" ]; then
            echo "::warning title=data-only-tests::data-reading tests did not pass (outcome: $DATA_TESTS); blocking, read the step log"
          fi
          {
            echo "$LINE"
            echo ""
            echo "Changed files (status, path):"
            sed 's/^/    /' "$RUNNER_TEMP/changes.txt" 2> /dev/null
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
  # Early warning, NOT a required check (brief 2026-10-29). The required `lint` job above tests the
  # lock, i.e. what production runs. This job tests the newest versions ml/requirements.txt allows,
  # so an upstream release that breaks the suite shows here (red on PRs) before anyone moves the
  # lock to it. Branch protection does not list it, so it never blocks a merge, and ci-health
  # judges only the required contexts, so it never pages.
  newest-allowed-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the newest versions ml/requirements.txt allows
        run: pip install -q --upgrade -r ml/requirements.txt
      - name: Show installed versions
        run: python scripts/print_runtime_versions.py --lock ml/requirements-inference.lock
      - name: Run full pytest suite on the newest allowed versions
        run: |
          pytest \
            -m "not integration" \
            tests/ -q

  # PWA pure-function JS tests (app.js logic: comparisons, dedup, good-price,
  # scrape parsing, stale-banner, trend). These existed under tests/*.js but ran
  # in NO workflow — scraper-canary.yml only covers scraper/**.
  # This job closes that gap so app.js logic is gated on every push/PR.
  # Dep-free (node builtins + inlined functions); no npm install needed.
  # Scope of THIS job: the tests here exercise inlined COPIES of app.js functions
  # ("must match app.js"), not app.js itself, so a regression in app.js that a copy
  # doesn't reproduce is invisible to it -- verified 2026-09-21 by inverting isToday in
  # app.js: all 115 tests in this job still passed. The one test that drives the real
  # app.js (test_stale_banner_headless.js, needs Playwright + a browser) runs in the
  # separate `pwa-headless` job below.
  #
  # AJ2 (2026-09-11/12): test_tier_degradation_visible.js and
  # test_vol_regime.js added below -- both existed and passed locally since
  # PR #1358/#1340 respectively, but neither was ever added to this explicit
  # list, so neither ever ran in CI (7-8 days, silently). Found by
  # scripts/check_test_registry_complete.py (new step at the bottom of the
  # `lint` job, below) sweeping every JS test file against what this file
  # actually references -- that script now gates any FUTURE instance of this
  # exact gap.
  pwa-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Run PWA pure-function tests
        run: |
          node --test \
            tests/test_analytics.js \
            tests/test_calculator.js \
            tests/test_calibration_confidence.js \
            tests/test_chart_cdn_resilience.js \
            tests/test_chart_year_labels.js \
            tests/test_claim_freshness.js \
            tests/test_comparisons.js \
            tests/test_site_wording_basis.js \
            tests/test_dedup.js \
            tests/test_direction_signal_one_source.js \
            tests/test_feature_flags.js \
            tests/test_good_price.js \
            tests/test_long_history.js \
            tests/test_hwk_range_explainer.js \
            tests/test_hero_display_state.js \
            tests/test_hwk_computed_numbers.js \
            tests/test_page_v2.js \
            tests/test_pvalue_format.js \
            tests/test_scrape.js \
            tests/test_track_record_caption.js \
            tests/test_sentry_init.js \
            tests/test_stale_banner.js \
            tests/test_tier_degradation_visible.js \
            tests/test_vol_regime.js \
            tests/test_driver_headline_signs.js \
            tests/test_verdict_week_window.js \
            scraper/test_retailer_enabled.mjs
      - name: Run dead-man's-switch Worker tests
        # Code-quality gate only -- this does NOT wire the switch's own
        # operation into GitHub Actions. It runs entirely on Cloudflare
        # Cron Triggers (see worker-deadman/README.md); this step only
        # lints/tests the source before it's deployed by hand.
        #
        # AI2 (production audit continuation, 2026-09-11/12): explicit file
        # list, not a glob -- deliberately, so a new test file added to
        # worker-deadman/test/ without also being added here is a visible,
        # reviewable diff line, not a silent CI gap. (A glob would have hidden
        # exactly the omission this comment now prevents: this line, before
        # this edit, ran only deadman.test.mjs and would have silently never
        # run pr_trigger_health.test.mjs.)
        run: node --test worker-deadman/test/deadman.test.mjs worker-deadman/test/pr_trigger_health.test.mjs

  # Drives the REAL app.js in headless Chromium (see the scope note on pwa-js above).
  # Deliberately not added to branch protection's required contexts -- changing the
  # required set is a separate, human decision. Same Node/Playwright setup as
  # render-smoke.yml (pinned action SHAs copied from there).
  pwa-headless:
    runs-on: ubuntu-latest
    # 20, not 10: 6 of the 7 non-green runs in 55 (2026-10-22) were the job timeout firing while
    # `playwright install --with-deps` took 7.7-10.0 min (normally 0.3-0.6); the tests themselves take ~2.5.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json
      - name: Install scraper dependencies (Playwright lives here)
        working-directory: scraper
        run: npm ci || npm install
      - name: Install Playwright browsers
        working-directory: scraper
        run: npx playwright install --with-deps chromium
      - name: Run the headless banner test against the real app.js
        run: node tests/test_stale_banner_headless.js
      - name: Run the service-worker offline data-fallback test
        run: node tests/test_sw_offline_headless.js
      - name: Run the service-worker update test (older worker -> newer deploy; offline; 3 s timeout; build skew)
        run: node tests/test_sw_update_headless.js
      - name: Run the feature-flag leak-detection headless test
        run: node tests/test_feature_flags_headless.js
      - name: Run the analytics-off headless test (flag off = identical DOM, no beacon; item 5c)
        run: node tests/test_analytics_off_headless.js
      - name: Run the page_v2 (item 6) headless test
        run: node tests/test_page_v2_headless.js
      - name: Run the retailer-takedown fallback render test (ADR 059)
        run: node tests/test_retailer_takedown_headless.js
      - name: Run the hero display-state test (E2 + ADR 059 gates)
        run: node tests/test_hero_display_headless.js
      - name: Run the no-sideways-scroll test against the real page
        run: node tests/test_no_horizontal_scroll_headless.js
      - name: Run the history-series test (GG 3d; history readers keep working on a shortened prices.json)
        run: node tests/test_history_series_headless.js

  # Forward lint+pwa-js's real result as commit statuses (bug #4, docs/RUNBOOK.md).
  # Branch protection's required_status_checks matches by context NAME across both
  # Check Runs and Commit Statuses — it doesn't care which API produced the match.
  # bot-pr-sync (CI_MERGE_PAT-authored pushes) dispatches this workflow via
  # workflow_dispatch rather than relying on the native pull_request trigger, and
  # workflow_dispatch-triggered check-runs were observed NOT reliably linking to the
  # PR for merge-eligibility purposes (intermittent, mechanism never fully confirmed —
  # see RUNBOOK). A commit status is SHA-scoped with no PR-linkage concept at all, so
  # it sidesteps that ambiguity entirely regardless of triggering event or webhook
  # delivery reliability. Runs on every trigger (push/pull_request/workflow_dispatch/
  # schedule) — harmless redundancy for normal PRs, load-bearing for bot ones.
  post-required-check-status:
    needs: [lint, pwa-js]
    if: needs.lint.result == 'success' && needs['pwa-js'].result == 'success'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Post lint + pwa-js as commit statuses on the head SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -e
          # One GitHub 502 here (2026-10-12 12:27Z) left a bot data PR without its required statuses
          # for two hours. Retry with a growing pause; only a persistent failure fails the job.
          post_status() {
            for attempt in 1 2 3 4 5; do
              if gh api "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
                -f state=success \
                -f context="$1" \
                -f description="Forwarded from run ${GITHUB_RUN_ID} (job result: success)" \
                -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; then
                return 0
              fi
              echo "status post for $1 failed (attempt ${attempt}/5)" >&2
              if [ "${attempt}" -lt 5 ]; then sleep $((attempt * 15)); fi
            done
            return 1
          }
          for CTX in lint pwa-js; do
            post_status "${CTX}"
          done

  # Enforces service-worker.js's own CACHE INVALIDATION CONTRACT: cache-first
  # shell serving means a client that already installed this SW never re-fetches
  # index.html/app.js/style.css/manifest.webmanifest unless service-worker.js's
  # own bytes change (which is what forces registration.update() to reinstall).
  # VERSION went unbumped for 11 merged PRs (2026-06-08 to 2026-07-19) before
  # this was added — returning visitors were frozen on a stale, drifted shell
  # with no error and no signal. This job fails fast the next time a shell file
  # changes without a VERSION bump instead of relying on someone remembering.
  sw-version-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require correct VERSION handling for the active Pages build mode
        # Logic lives in scripts/check_sw_version_guard.py (unit-tested in
        # tests/test_check_sw_version_guard.py), not inline here, so the legacy-vs-actions
        # rule (see that script's module docstring and the CACHE INVALIDATION CONTRACT
        # comment at the top of service-worker.js) has test coverage of its own. Reads the
        # guarded set from service-worker.js's own SHELL_FILES via scripts/sw_shell_files.py,
        # not a hand-typed regex -- the old 4-file regex omitted i18n.js.
        env:
          PAGES_BUILD_MODE: ${{ vars.PAGES_BUILD_MODE }}
        run: python3 scripts/check_sw_version_guard.py --base "origin/${{ github.base_ref }}"

  # X2 (audit 2026-09-05): PR #1393's un-reviewed threshold change reached
  # master anyway -- through PR #1394's squash-merge, because #1394's branch
  # was created without returning to master first, so its history included
  # #1393's commit as an ancestor. #1393 itself correctly showed as OPEN the
  # whole time; nothing detected the leak until it was found by chance.
  # Z1 (audit 2026-09-05): the original ancestry check (check_branch_base)
  # was pressure-tested with real scratch PRs and found unable to fire on
  # this exact incident shape -- a sibling branch's divergence point is
  # always trivially an ancestor of the base, by construction. Deleted and
  # replaced with two effect-based checks: does any commit unique to this
  # PR share exact patch content with a commit on ANY other open PR (no
  # label needed), and does every file in the full diff trace back to a
  # commit unique to this branch. The boundary-gated label overlap check is
  # kept as a supplementary signal on top. See
  # scripts/check_pr_boundary_leak.py's own docstring for the full mechanism
  # and its stated blind spots.
  boundary-leak-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check for foreign commits, unexplained file residue, and boundary-gated overlap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_pr_boundary_leak.py \
            --pr "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --base "${{ github.base_ref }}"

  # AF1 (audit 2026-09-10): mechanizes a rule that was written down after
  # PR #1353 (2026-09-04) and violated again by PR #1539 (2026-09-10) --
  # both widened a bot-pr-sync-calling workflow's `git add` list to include
  # README.md/docs/*.md without checking bot-pr-sync/action.yml's own
  # independent data-only allowlist first, and both blocked production data
  # sync for hours before being reverted (#1539 for 7+ hours, until
  # forecast.json's age reached 7.76h against the dead-man's-switch's 10h
  # WARN). A rule enforced only by a human remembering to read a guard
  # before touching the path it guards is not enforced -- this fails the PR
  # at review time instead. Deliberately NOT path-filtered to only
  # .github/workflows/** changes, unlike AF1's own originating instruction
  # -- this repo has its own documented incident (2026-08-06, PRs #293-300/
  # #459/#633) where path-filtering a required-adjacent check produced
  # "required check never ran" rather than "failed", a worse failure mode
  # than the extra few seconds this check costs on every PR. See
  # scripts/check_bot_pr_sync_allowlist.py's own docstring for the full
  # mechanism and its stated blind spots.
  bot-pr-sync-allowlist-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify every bot-pr-sync-calling workflow's git-add paths are allowlist-covered
        run: python scripts/check_bot_pr_sync_allowlist.py

  # GG spec, 2026-09-23: a passing ml.direction.gate decision must never
  # reach users without an explicit, GG-approved promotion record. Traced
  # end to end (docs/adr/036) and confirmed true today, but that's a fact
  # about the current code, not a structural guarantee -- this makes it one.
  # Deliberately NOT path-filtered (same AF1-incident reasoning as
  # bot-pr-sync-allowlist-check above): a required-adjacent check that only
  # runs on some paths can produce "never ran" instead of "failed", which is
  # worse than the few extra seconds of running it on every PR. See
  # scripts/check_direction_signal_not_wired_without_promotion.py's own
  # docstring for the full mechanism and its stated blind spots.
  direction-signal-promotion-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify no user-facing surface reads the direction gate without a promotion record
        run: python scripts/check_direction_signal_not_wired_without_promotion.py

  # Fail if any <!--METRIC:...--> marker in README.md/docs/*.md doesn't
  # resolve, or resolves to text that differs from what's committed --
  # same "regenerate, don't hand-edit" idiom as sw-version-guard above.
  # Three numbers were found hand-copied and stale before this existed
  # (R²=0.96, 97.3% coverage, direction-signal h1/h2 accuracy — 21-22 days
  # stale despite live sources existing for all three; session dated
  # 2026-08-27). See scripts/inject_metrics.py's module docstring for the
  # marker syntax and the FROZEN-block convention for numbers that must
  # NOT be auto-updated (ADR snapshots, the SHA-pinned backtest citation).
  docs-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --grace-minutes reads data files' commit times (see scripts/inject_metrics.py)
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Every METRIC marker must resolve and match committed text
        # 45 min = the docs-refresh PR's usual lag behind a data update (5-15 min) plus CI; drift
        # older than that still fails, so a stalled refresh is still caught.
        run: python scripts/inject_metrics.py --check --grace-minutes 45

  # Dependency vulnerability audit — informational only, not a required check.
  # Neither lint nor pwa-js depends on this job; a finding here should not block
  # merges. Findings are surfaced in the job log for manual triage.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: pip-audit (ml/requirements-inference.lock)
        continue-on-error: true
        run: |
          pip install -q pip-audit==2.10.1
          pip-audit -r ml/requirements-inference.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: npm audit (scraper)
        continue-on-error: true
        working-directory: scraper
        run: npm audit --audit-level=high
