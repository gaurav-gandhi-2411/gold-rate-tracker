name: Scrape Tanishq (self-hosted)

# Split out of check-price.yml (audit 2026-09, fix/selfhosted-job-cannot-
# block-schedule): measured 14 of 28 missed check-price.yml scheduled slots
# over a 6.93-day post-#1222 window coincided with a PRIOR check-price.yml
# run still non-completed at that exact timestamp -- every one of those 14
# was this job sitting `queued` for hours (its own recorded duration
# distribution: median 5.4min, p90 4.87h, max 5.94h, 6 of 30 runs >3h,
# ALL of them the `cancelled` conclusion, i.e. genuinely stuck in queue, not
# slow execution). GitHub's own scheduled-workflow docs say scheduled runs
# can be "delayed or dropped during periods of high load"; a workflow RUN
# stays non-`completed` until every one of its jobs finishes, regardless of
# `needs:` or separate `concurrency:` groups -- co-locating this job in
# check-price.yml meant an offline/backlogged self-hosted runner could hold
# that run open for hours, and the next scheduled trigger for the SAME
# workflow apparently doesn't fire (or gets silently dropped) while a prior
# run of it is still open. Splitting into its own workflow file removes
# check-price.yml from this job's queue state entirely -- check-price.yml's
# `check` job now always completes in minutes, so it can never overlap its
# own next scheduled tick, no matter how long a self-hosted runner outage
# runs. This job keeps its own independent 3h cron (same offset as
# check-price.yml, since a home-runner outage HERE is still bounded by ITS
# OWN 24h auto-cancel -- see docs/RUNBOOK.md's "graceful degradation"
# section, now scoped to this file's job instead of check-price.yml's).
#
# `timeout-minutes: 25` below does NOT fix this on its own and never did --
# confirmed from the duration data above: timeout-minutes only starts
# counting once a runner actually picks up the job and starts executing it;
# a job sitting `queued` with no runner available accrues zero timeout-
# minutes clock time no matter how long it waits. That's why this is a
# workflow split, not a smaller timeout value.

on:
  schedule:
    - cron: "7 */3 * * *" # same cadence/offset as check-price.yml
  workflow_dispatch: # allows manual run from the Actions tab
  push:
    branches: [master]
    paths:
      - "scraper/**"
      - ".github/workflows/scrape-tanishq-selfhosted.yml"

permissions:
  contents: write # needed so the action can commit prices.json back to the repo
  pull-requests: write # needed to open/auto-merge the tanishq-sync PR (master requires status checks)

jobs:
  scrape-tanishq-selfhosted:
    # Tanishq's WAF blocks GitHub-hosted (datacenter) runner IPs but the
    # identical scrape succeeds from a residential IP (confirmed empirically
    # during the 2026-07-23 IBJA-outage diagnosis). This job runs the exact
    # same scraper/scrape.js — same code, same headers, no proxies, IP
    # rotation, fingerprint spoofing, or CAPTCHA solving — from a
    # self-hosted runner on a normal home connection. See docs/RUNBOOK.md
    # for the runner setup instructions and the security tradeoffs of
    # self-hosted runners on a public repo.
    #
    # Tanishq stays opportunistic ENRICHMENT (ADR 025), never a hard
    # dependency: this workflow is entirely independent of check-price.yml
    # (separate file now, not just no `needs:`) so an offline/asleep runner
    # can never block the primary pipeline's own scheduling, not just its
    # own single run. GitHub queues a job with no available runner for up to
    # 24h before auto-cancelling it — that 24h window is now scoped to only
    # this workflow's own next scheduled tick, never check-price.yml's.
    # `continue-on-error: true` at the job level additionally guarantees
    # this job's own failure never marks the workflow run as failed.
    runs-on: [self-hosted, tanishq-scraper]
    # 20min was tight-but-sufficient under normal conditions (healthy runs land
    # in ~4min). Bumped to give headroom for actions/checkout's internal
    # recreate-from-scratch fallback (observed 2026-07-30: ~8min) when the repo's
    # local git state can't be cleanly reset -- e.g. after a mid-transfer
    # connection drop on a prior run. See docs/RUNBOOK.md "Self-hosted runner
    # reliability" for the incident this headroom was sized against. Does NOT
    # bound queue-wait time (see this file's header comment) -- only actual
    # execution time once a runner picks the job up.
    timeout-minutes: 25
    continue-on-error: true
    concurrency:
      group: tanishq-selfhosted-scrape
      cancel-in-progress: false
    # Every step below is bash-flavoured (||, set -e, heredocs) — fine on
    # ubuntu-latest's default shell, but a Windows self-hosted runner
    # defaults `run:` to Windows PowerShell 5.1, which doesn't support any
    # of that syntax.
    #
    # `shell: bash` alone isn't enough on a fresh Windows install either:
    # Git for Windows' installer adds `Git\cmd` to PATH by default but NOT
    # `Git\bin` (where bash.exe actually lives), so the only "bash" reachable
    # via a normal PATH lookup was Windows' own WSL launcher stub at
    # C:\Windows\system32\bash.EXE — which fails immediately with "no
    # installed distributions" since WSL was never set up. Confirmed live
    # (run 29999091930). This also broke bot-pr-sync's own composite-action
    # step below (it hardcodes `shell: bash` internally; a job-level
    # `defaults.run.shell` override doesn't reach into a composite action's
    # own step definitions, so pointing *this* job's default at Git's
    # bash.exe directly wouldn't have fixed that step anyway — confirmed
    # live, run 29999459405).
    #
    # Fixed at the host level instead (see docs/RUNBOOK.md): the runner
    # Windows service has a PATH override scoped to *just its own process
    # environment* (via its service registry key's Environment value, not
    # the machine-wide PATH) that puts Git's bin dir first — so plain
    # `shell: bash` now resolves correctly for every step in this job,
    # including composite actions, without touching what "bash" resolves to
    # anywhere else on the host.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci || npm install

      - name: Install Playwright browsers
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      - name: Scrape Tanishq and update prices.json
        id: scrape
        working-directory: scraper
        continue-on-error: true
        # NTFY_TOPIC/DROP_THRESHOLD removed: update-and-notify.js no longer sends
        # the drop-alert (retired in favour of T3 in ml/notifications.py). This
        # step only appends the reading; ml.notifications (in check-price.yml's
        # `check` job) does the alerting once it next reads this data.
        # stderr captured separately (H3, session dated 2026-08-28): scrape.js
        # already logs "[scraper] fetch_method=requests|playwright" to stderr
        # (Phi24) -- redirecting it to its own file lets the health-recording
        # step below read which path succeeded, without adding a field to the
        # reading object itself (which would permanently change prices.json's
        # schema for every future entry -- avoided on purpose).
        run: |
          set -e
          node scrape.js 2> /tmp/scrape_stderr.log | tee /tmp/reading.json
          cat /tmp/scrape_stderr.log  # still visible in the job log
          cat /tmp/reading.json | node update-and-notify.js

      - name: Flag scrape miss
        # continue-on-error above means a CF-blocked run still reports green
        # at the step level. Surface the miss as a run-summary annotation so
        # it's visible operationally even though it's expected occasionally
        # (a residential IP is not immune to CF, just far less likely to be
        # blocked than a datacenter one) and never raises a user-facing
        # alert — the site falls through to IBJA-calibrated / fusion-consensus.
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::warning title=Scrape miss (self-hosted)::Tanishq scrape produced no reading this run from the self-hosted runner. prices.json not updated. Site continues serving the IBJA-calibrated/fusion-consensus estimate."

      - name: Commit Tanishq reading and record job health
        id: commit
        # always() so a failure anywhere upstream (checkout, npm ci, playwright
        # install, scrape itself) still gets recorded -- this is the health
        # signal T12 (ml/notifications.py) reads to detect "runner is online and
        # picking up jobs, but they keep failing" (docs/RUNBOOK.md), a distinct
        # failure mode from "runner offline" (which stays silent by design).
        if: always()
        continue-on-error: true
        run: |
          set -e
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "No git working tree (checkout itself failed) -- skipping commit and health record."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "gold-rate-bot"
          git config user.email "actions@users.noreply.github.com"

          if [ "${{ steps.scrape.outcome }}" = "success" ]; then
            git add data/prices.json
          fi

          # Pure bash (no python3/jq assumed present on this Windows self-hosted
          # host) -- the health record has a fixed, trivial 4-key schema, so a
          # regex extraction of the prior count is simpler than adding a new
          # runtime dependency to a job that has never needed Python.
          HEALTH_FILE="data/tanishq_selfhosted_health.json"
          PRIOR_COUNT=0
          if [ -f "$HEALTH_FILE" ]; then
            EXTRACTED=$(grep -o '"consecutive_job_failures": *[0-9]*' "$HEALTH_FILE" | grep -o '[0-9]*$' || true)
            if [ -n "$EXTRACTED" ]; then
              PRIOR_COUNT="$EXTRACTED"
            fi
          fi
          OUTCOME="${{ steps.scrape.outcome }}"
          if [ "$OUTCOME" = "success" ]; then
            NEW_COUNT=0
          else
            NEW_COUNT=$((PRIOR_COUNT + 1))
          fi
          {
            echo "{"
            echo "  \"schema_version\": 1,"
            echo "  \"consecutive_job_failures\": $NEW_COUNT,"
            echo "  \"last_job_outcome\": \"$OUTCOME\","
            echo "  \"last_updated_utc\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\""
            echo "}"
          } > "$HEALTH_FILE"
          git add "$HEALTH_FILE"

          # H3 (session dated 2026-08-28): append one record per run to a
          # rolling scrape-outcome log -- data/tanishq_scrape_outcomes.jsonl,
          # same append-only-log convention as data/direction_eval_history.jsonl.
          # fetch_method read from the stderr capture above (defaults to
          # "none" when the scrape failed before either path logged anything,
          # e.g. checkout/npm/playwright-install failing upstream). Still pure
          # bash -- same host constraint as above; the rolling rate itself is
          # computed separately by ml.scrape_metrics (Python, in check-price.yml's
          # `check` job) from this raw log, not here.
          FETCH_METHOD="none"
          if [ -f /tmp/scrape_stderr.log ]; then
            EXTRACTED_METHOD=$(grep -o 'fetch_method=[a-z]*' /tmp/scrape_stderr.log | tail -1 | cut -d= -f2 || true)
            if [ -n "$EXTRACTED_METHOD" ]; then
              FETCH_METHOD="$EXTRACTED_METHOD"
            fi
          fi
          OUTCOMES_LOG="data/tanishq_scrape_outcomes.jsonl"
          echo "{\"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"outcome\": \"$OUTCOME\", \"fetch_method\": \"$FETCH_METHOD\"}" >> "$OUTCOMES_LOG"
          git add "$OUTCOMES_LOG"

          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: append Tanishq reading (self-hosted scrape) [skip ci]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync Tanishq reading via bot PR
        # Separate branch from bot/data-sync (used by check-price.yml's `check`
        # job) so the two jobs' commits never race for the same PR/branch.
        # always() so this still runs (and pushes the health-record commit)
        # even when an upstream step failed -- the commit step above is
        # if:always() too.
        if: always() && steps.commit.outputs.changed == 'true'
        uses: ./.github/actions/bot-pr-sync
        with:
          branch: bot/tanishq-selfhosted-sync
          pr-title: "chore: append Tanishq reading (self-hosted scrape)"
          pr-body: "Automated Tanishq-only data sync from the self-hosted scraper, run ${{ github.run_id }}."
          token: ${{ secrets.CI_MERGE_PAT }}
          wait-minutes: "15"
