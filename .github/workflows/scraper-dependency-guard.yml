name: Scraper dependency guard

# Item 5a (2026-10-05). A PR that changes scraper/package*.json must cite a verified proof run on
# the self-hosted runner (install + real scrape, scratch PLAYWRIGHT_BROWSERS_PATH). Dependabot's
# Playwright bump #1846 broke the laptop scraper for ~11 h; #2316 reverted it. See
# scripts/check_scraper_dependency_change.py for the mechanism and its stated blind spots.
#
# Deliberately NOT path-filtered (same reasoning as lint.yml's bot-pr-sync-allowlist-check): a check
# that is skipped on some paths reads as "never ran" instead of "passed" once it is made required.
# The script itself decides, from the PR's file list, whether proof is needed, and passes in a few
# seconds when it is not.
#
# `edited` is in the trigger types because the proof is cited in the PR BODY: editing the body to
# add the run link must re-run the check.
#
# This workflow is its own file so lint.yml's required contexts ("lint", "pwa-js") and its
# commit-status forwarding are untouched. The job name below is the check name to add to branch
# protection's required status checks (GG step, docs/TANISHQ_TIMED_VISITS.md section 11).

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # bot-pr-sync's branches are pushed with a PAT and never fire the pull_request trigger (that is why
  # lint.yml is dispatched and forwarded as commit statuses). Since this check became required
  # (2026-10-08) every bot PR sat at "base branch policy prohibits the merge" (2026-10-09). The action
  # now dispatches this workflow with the PR number, and the last step forwards the result as a
  # commit status, exactly as lint.yml does.
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to check (set by bot-pr-sync)"
        required: true

permissions:
  contents: read
  pull-requests: read
  actions: read # reads the cited run, its jobs and its job log
  statuses: write # forwards the result as a commit status for dispatched runs

# The group carries the EVENT NAME on purpose. A docs-refresh PR fires this workflow twice for the same PR
# number: the pull_request run (its commit has no [skip ci]) and the run docs-refresh dispatches with
# `-f pr=`. With one shared group `cancel-in-progress` cancelled one of them, and a CANCELLED check run named
# `scraper-dependency-guard` blocks the merge ("base branch policy prohibits the merge") even though the
# forwarded status is `success`: PR #2864 on 2026-10-16 (cancelled pull_request run 38957199971, all three
# required statuses green, unmergeable until the run was re-run by hand); the same cancelled-vs-dispatched
# pattern matches the docs-refresh PRs that sat open 4 h 53 min (#2832) and 6 h 30 min (#2845). Newer runs
# of the SAME event still cancel older ones.
#
# An `edited` run gets a group of its own (its run id), so it never cancels, and is never cancelled by,
# the opened/synchronize run on the same commit. A body edit made while CI was running cancelled that run;
# merge-gate gate 2b fails on any cancelled run of the head commit, so the PR could not merge until the
# cancelled run was re-run by hand (PR #3292, 2026-10-29). `edited` stays in the trigger types: the proof
# citation still has to re-run the check.
concurrency:
  group: scraper-dependency-guard-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr }}${{ github.event.action == 'edited' && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  scraper-dependency-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require a verified self-hosted proof run for scraper dependency changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_scraper_dependency_change.py \
            --pr "${{ github.event.pull_request.number || inputs.pr }}" \
            --repo "${{ github.repository }}"
      - name: Forward the result as a commit status (dispatched runs only)
        if: success() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          # Retry: a single GitHub 502 must not leave a bot PR without its required status.
          for attempt in 1 2 3 4 5; do
            if gh api "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state=success -f context=scraper-dependency-guard \
              -f description="Forwarded from run ${GITHUB_RUN_ID} (job result: success)" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; then
              exit 0
            fi
            echo "status post failed (attempt ${attempt}/5)" >&2
            if [ "${attempt}" -lt 5 ]; then sleep $((attempt * 15)); fi
          done
          exit 1
