name: Check Gold Price

on:
  schedule:
    # Every 6 hours, at minute 0 (UTC). India is UTC+5:30, so this fires at
    # 05:30, 11:30, 17:30, 23:30 IST. Adjust if you want different IST times.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      pipeline_test:
        description: 'Send a one-shot CI->ntfy delivery test (temporary diagnostic, remove after use)'
        required: false
        default: 'false'
  push:
    branches: [master]
    paths:
      - "ml/inference.py"
      - "ml/features.py"
      - "ml/macro.py"
      - "ml/ibja.py"
      - "ml/chronos_forecast.py"
      - "ml/calibration.py"
      - "ml/notifications.py"
      - "scraper/**"
      - ".github/workflows/check-price.yml"

permissions:
  contents: write # needed so the action can commit prices.json back to the repo

concurrency:
  group: check-price
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci || npm install

      - name: Install Playwright browsers
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      - name: Scrape Tanishq and update prices.json
        id: scrape
        working-directory: scraper
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DROP_THRESHOLD: "100"
        run: |
          set -e
          node scrape.js | tee /tmp/reading.json
          cat /tmp/reading.json | node update-and-notify.js

      - name: Alert on scraper failure
        if: steps.scrape.outcome == 'failure'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # ntfy headers must be ASCII-only — the ₹ bug (Fix 1) must not be
          # reintroduced here. No currency symbols in any header value.
          [ -z "${NTFY_TOPIC}" ] && echo "NTFY_TOPIC not set — skipping alert." && exit 0
          curl -s \
            -H "Title: Gold Tracker: Scraper Down" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -d "Tanishq scraper failed. Check logs: ${RUN_URL}" \
            "https://ntfy.sh/${NTFY_TOPIC}" || true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements-inference.lock

      - name: Install ML dependencies
        run: |
          pip install -q uv
          uv pip install --system \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r ml/requirements-inference.lock

      - name: Fetch macro features
        continue-on-error: true
        run: python ml/macro.py

      - name: Check macro cache age
        run: |
          python3 -c '
          import json, sys
          from pathlib import Path
          status_path = Path("data/macro_status.json")
          if not status_path.exists():
              print("macro_status.json not found -- skipping age check")
              sys.exit(0)
          status = json.loads(status_path.read_text())
          age = status.get("cache_age_days")
          fail_threshold = status.get("fail_threshold_days", 14)
          if age is None:
              print("Macro cache does not exist -- skipping age check")
              sys.exit(0)
          print(f"Macro cache age: {age:.2f} days (fail threshold: {fail_threshold}d)")
          fc_path = Path("data/forecast.json")
          if fc_path.exists():
              try:
                  fc = json.loads(fc_path.read_text())
                  fc["macro_cache_age_days"] = age
                  fc_path.write_text(json.dumps(fc, indent=2) + "\n")
                  print(f"Patched macro_cache_age_days={age} into forecast.json")
              except Exception as e:
                  print(f"Warning: could not patch forecast.json: {e}")
          if age > fail_threshold:
              print(f"ERROR: Macro cache is {age:.1f} days old (>{fail_threshold}d). Macro features are stale.")
              sys.exit(1)
          '

      - name: Check forecast drift
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DRIFT_THRESHOLD: "1.5"
        run: python -m ml.drift

      - name: Run inference
        continue-on-error: true
        run: python -m ml.inference

      - name: Forecast staleness monitor
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python3 -c '
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path
          try:
              fc = json.loads(Path("data/forecast.json").read_text())
              predicted_at = fc.get("predicted_at", "")
              if not predicted_at:
                  print("No predicted_at in forecast.json -- skipping staleness check")
                  sys.exit(0)
              ts = datetime.fromisoformat(predicted_at.replace("Z", "+00:00"))
              age_h = (datetime.now(timezone.utc) - ts).total_seconds() / 3600
          except Exception as e:
              print(f"Cannot read forecast.json: {e}")
              sys.exit(0)
          print(f"Forecast age: {age_h:.1f}h")
          if age_h <= 18:
              print("Forecast is fresh -- no alert.")
              sys.exit(0)
          topic = os.environ.get("NTFY_TOPIC", "")
          if not topic:
              print("NTFY_TOPIC not set -- skipping staleness alert.")
              sys.exit(0)
          hours = int(age_h)
          import urllib.request
          body = f"Forecast is {hours}h old. Check the CI run for errors.".encode()
          req = urllib.request.Request(
              f"https://ntfy.sh/{topic}",
              data=body,
              method="POST",
              headers={
                  "Title": f"Gold Tracker: forecast stale ({hours}h)",
                  "Priority": "high",
                  "Tags": "warning",
              },
          )
          try:
              urllib.request.urlopen(req)
              print(f"Forecast staleness alert sent ({hours}h old).")
          except Exception as e:
              print(f"Failed to send alert: {e}")
          ' || true

      - name: Run commentary
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python ml/commentary.py

      - name: Append IBJA rates
        continue-on-error: true
        run: python -m ml.ibja

      - name: Cache Chronos model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: chronos-bolt-tiny-${{ env.CHRONOS_BOLT_TINY_REVISION }}
        env:
          CHRONOS_BOLT_TINY_REVISION: a0e552de83495b5c28c14c71c374f3e33280b340

      - name: Run Chronos probe
        continue-on-error: true
        env:
          CHRONOS_BOLT_TINY_REVISION: a0e552de83495b5c28c14c71c374f3e33280b340
        run: python -m ml.chronos_forecast --probe

      - name: Commit Chronos probe data
        continue-on-error: true
        run: |
          git config user.name "gold-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/chronos_probe.json || true
          git diff --staged --quiet || git commit -m "chore: update chronos probe [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      - name: Restore notification state
        uses: actions/cache/restore@v4
        with:
          path: data/notification_state.json
          key: notification-state-${{ github.run_id }}
          restore-keys: |
            notification-state-

      - name: Pipeline delivery test (TEMPORARY — remove after verification)
        if: inputs.pipeline_test == 'true'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          cat > /tmp/pipeline_test.py << 'PYEOF'
          import os, sys
          sys.path.insert(0, '.')

          # --- Length / whitespace audit (no secret content printed) ---
          topic = os.environ.get("NTFY_TOPIC", "")
          EXPECTED_LEN = 18  # len("gold-msgg-7k2x9p4r")
          actual_len = len(topic)
          print(f"NTFY_TOPIC length  : {actual_len}")
          print(f"Expected length    : {EXPECTED_LEN}")
          print(f"Length match       : {actual_len == EXPECTED_LEN}")
          print(f"Stripped length    : {len(topic.strip())} (differs => leading/trailing whitespace)")
          print(f"Ends with \\n (0x0a): {topic.endswith(chr(10))}")
          print(f"Ends with \\r (0x0d): {topic.endswith(chr(13))}")
          print(f"Ends with space    : {topic.endswith(' ')}")
          if actual_len > EXPECTED_LEN:
              extra = topic[EXPECTED_LEN:]
              print(f"Extra chars after pos 18: {repr(extra)}")
          print()

          # --- Send test via real send_pending path ---
          from ml.notifications import PendingAlert, NotificationState, send_pending
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now_ist = datetime.now(ZoneInfo("Asia/Kolkata"))
          alert = PendingAlert(
              trigger_id="PIPELINE_TEST",
              title="Gold pipeline test - CI send path check",
              body="CI runner send_pending path confirmed. T8_EVENING will use this exact path tonight.",
              priority=3,
              tags=["robot"],
              click_url="https://gaurav-gandhi-2411.github.io/gold-rate-tracker/",
              queued_at=now_ist.isoformat(),
              bypass_quiet=True,
          )
          state = NotificationState()
          sent = send_pending([alert], state, now_ist)
          for s in sent:
              print(f"[{'OK' if s.success else 'FAILED'}] {s.trigger_id}: {s.title}")
          PYEOF
          python /tmp/pipeline_test.py

      - name: Run notifications
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m ml.notifications

      - name: Save notification state
        uses: actions/cache/save@v4
        if: always() && github.ref_name == 'master'
        with:
          path: data/notification_state.json
          key: notification-state-${{ github.run_id }}

      - name: Record prediction metrics
        continue-on-error: true
        run: python -m ml.metrics --record

      - name: Commit updated data files
        run: |
          git config user.name "gold-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json data/forecast.json data/commentary.json data/drift_metrics.json data/metrics_history.json data/ibja_rates.parquet || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update gold prices and forecast [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Staleness guard
        if: always()
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          # Use Python for UTC date math — bash date -d arithmetic is not portable.
          # Timestamps in prices.json are UTC ISO-8601 with Z suffix; replace Z
          # with +00:00 so fromisoformat() works on Python 3.7–3.10 (pre-3.11 fix).
          # ntfy headers must be ASCII-only (see Fix 1 for the ₹ bug this avoids).
          python3 -c '
          import json, os, sys
          from datetime import datetime, timezone
          try:
              with open("data/prices.json") as f:
                  data = json.load(f)
              ts = datetime.fromisoformat(data[-1]["timestamp"].replace("Z", "+00:00"))
              age_h = (datetime.now(timezone.utc) - ts).total_seconds() / 3600
          except Exception as e:
              print("Cannot read prices.json:", e)
              age_h = 999
          print(f"Last reading age: {age_h:.1f}h")
          if age_h <= 8:
              print("Fresh — no staleness alert.")
              sys.exit(0)
          topic = os.environ.get("NTFY_TOPIC", "")
          if not topic:
              print("NTFY_TOPIC not set — skipping staleness alert.")
              sys.exit(0)
          hours = int(age_h)
          import urllib.request
          body = f"Last reading is {hours}h old. Scraper may be failing.".encode()
          req = urllib.request.Request(
              f"https://ntfy.sh/{topic}",
              data=body,
              method="POST",
              headers={
                  "Title": f"Gold Tracker: data stale ({hours}h)",
                  "Priority": "high",
                  "Tags": "warning",
              },
          )
          try:
              urllib.request.urlopen(req)
              print(f"Staleness alert sent ({hours}h old).")
          except Exception as e:
              print(f"Failed to send staleness alert: {e}")
          ' || true
