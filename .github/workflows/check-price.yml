name: Check Gold Price

on:
  schedule:
    # Every 6 hours, at minute 0 (UTC). India is UTC+5:30, so this fires at
    # 05:30, 11:30, 17:30, 23:30 IST. Adjust if you want different IST times.
    - cron: "0 */6 * * *"
  workflow_dispatch: # allows manual run from the Actions tab
  push:
    branches: [master]
    paths:
      - "ml/inference.py"
      - "ml/models/**"
      - "ml/features.py"
      - "ml/macro.py"
      - "ml/regime.py"
      - "models/production/**"
      - "data/history_seed.json"
      - "scraper/**"
      - ".github/workflows/check-price.yml"

permissions:
  contents: write # needed so the action can commit prices.json back to the repo

concurrency:
  group: check-price
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci || npm install

      - name: Install Playwright browsers
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      - name: Scrape Tanishq and update prices.json
        working-directory: scraper
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DROP_THRESHOLD: "100"
        run: |
          set -e
          node scrape.js | tee /tmp/reading.json
          cat /tmp/reading.json | node update-and-notify.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements.txt

      - name: Install ML dependencies
        run: pip install -q -r ml/requirements.txt

      - name: Fetch macro features
        continue-on-error: true
        run: python ml/macro.py

      - name: Check forecast drift
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DRIFT_THRESHOLD: "0.5"
        run: python -m ml.drift

      - name: Run forecast
        continue-on-error: true
        run: python ml/forecast.py

      - name: Run commentary
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python ml/commentary.py

      - name: Commit updated data files
        run: |
          git config user.name "gold-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json data/forecast.json data/commentary.json data/regime.json data/drift_metrics.json || true
          git add models/production/nbeats.onnx 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update gold prices and forecast [skip ci]"
            git push
          fi
