name: Check Gold Price

on:
  schedule:
    # Every 3 hours, at minute 0 (UTC). India is UTC+5:30, so this fires at
    # ~05:30, 08:30, 11:30, 14:30, 17:30, 20:30, 23:30, 02:30 IST (8 runs/day).
    # T8 morning window 08-14 IST and evening window 18-22 IST each contain
    # at least one 3h-cadence slot, so twice-daily digests are unaffected.
    - cron: "0 */3 * * *"
  workflow_dispatch: # allows manual run from the Actions tab
  repository_dispatch:
    types: [tanishq-price]
  push:
    branches: [master]
    paths:
      - "ml/inference.py"
      - "ml/features.py"
      - "ml/macro.py"
      - "ml/ibja.py"
      - "ml/chronos_forecast.py"
      - "ml/calibration.py"
      - "ml/notifications.py"
      - "ml/drivers.py"
      - "ml/feature_store.py"
      - "ml/calendar_events.py"
      - "scraper/**"
      - ".github/workflows/check-price.yml"

permissions:
  contents: write # needed so the action can commit prices.json back to the repo
  pull-requests: write # needed to open/auto-merge the data-sync PR (master requires status checks)
  actions: write # needed to dispatch lint.yml explicitly (see note below on GITHUB_TOKEN cascade suppression)

concurrency:
  group: check-price
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # 20min for scrape+ML steps, +15min headroom for the PR auto-merge wait
    # (generate-og-image.yml's workflow_run trigger fires on this job's
    # completion, so it must wait for the data-sync PR to actually merge —
    # otherwise it screenshots stale data).
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci || npm install

      - name: Install Playwright browsers
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      - name: Scrape Tanishq and update prices.json
        id: scrape
        working-directory: scraper
        continue-on-error: true
        env:
          # NTFY_TOPIC/DROP_THRESHOLD removed: update-and-notify.js no longer sends
          # the drop-alert (retired in favour of T3 in ml/notifications.py). This
          # step only appends the reading; the notifications step does the alerting.
          GH_EVENT_NAME: ${{ github.event_name }}
          DISPATCH_22K: ${{ github.event.client_payload['22k'] }}
          DISPATCH_24K: ${{ github.event.client_payload['24k'] }}
          DISPATCH_18K: ${{ github.event.client_payload['18k'] }}
          DISPATCH_TIMESTAMP: ${{ github.event.client_payload.timestamp }}
        run: |
          set -e
          if [ "$GH_EVENT_NAME" = "repository_dispatch" ]; then
            node dispatch-validate.js > /tmp/dispatch_reading.json
            if [ -s /tmp/dispatch_reading.json ]; then
              cat /tmp/dispatch_reading.json | node update-and-notify.js
            else
              >&2 echo "[dispatch] payload rejected or invalid — treating as miss"
              exit 1
            fi
          else
            node scrape.js | tee /tmp/reading.json
            cat /tmp/reading.json | node update-and-notify.js
          fi

      - name: Flag scrape miss
        # The scrape step is continue-on-error, so a CF-blocked / rejected-dispatch
        # run still reports green. Surface the miss as a run-summary annotation so a
        # frozen prices.json is visible operationally. User-facing staleness is
        # covered by T9 in ml.notifications; this is CI visibility only.
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::warning title=Scrape miss::Tanishq scrape produced no reading this run (CF block or rejected dispatch); prices.json not updated. T9 covers user-facing staleness."

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements-inference.lock

      - name: Install ML dependencies
        run: |
          pip install -q uv
          uv pip install --system \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r ml/requirements-inference.lock

      - name: Fetch macro features
        continue-on-error: true
        run: python ml/macro.py

      - name: Check macro cache age
        run: |
          python3 -c '
          import json, sys
          from pathlib import Path
          status_path = Path("data/macro_status.json")
          if not status_path.exists():
              print("macro_status.json not found -- skipping age check")
              sys.exit(0)
          status = json.loads(status_path.read_text())
          age = status.get("cache_age_days")
          fail_threshold = status.get("fail_threshold_days", 14)
          if age is None:
              print("Macro cache does not exist -- skipping age check")
              sys.exit(0)
          print(f"Macro cache age: {age:.2f} days (fail threshold: {fail_threshold}d)")
          fc_path = Path("data/forecast.json")
          if fc_path.exists():
              try:
                  fc = json.loads(fc_path.read_text())
                  fc["macro_cache_age_days"] = age
                  fc_path.write_text(json.dumps(fc, indent=2) + "\n")
                  print(f"Patched macro_cache_age_days={age} into forecast.json")
              except Exception as e:
                  print(f"Warning: could not patch forecast.json: {e}")
          if age > fail_threshold:
              print(f"ERROR: Macro cache is {age:.1f} days old (>{fail_threshold}d). Macro features are stale.")
              sys.exit(1)
          '

      - name: Check forecast drift
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DRIFT_THRESHOLD: "1.5"
        run: python -m ml.drift

      - name: Run inference
        continue-on-error: true
        run: python -m ml.inference

      - name: Run commentary
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python ml/commentary.py

      - name: Append IBJA rates
        continue-on-error: true
        run: python -m ml.ibja

      - name: Refit calibration if needed
        continue-on-error: true
        run: python -m ml.calibration

      - name: Cache Chronos model weights
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: chronos-bolt-tiny-${{ env.CHRONOS_BOLT_TINY_REVISION }}
        env:
          CHRONOS_BOLT_TINY_REVISION: a0e552de83495b5c28c14c71c374f3e33280b340

      - name: Run Chronos probe
        continue-on-error: true
        env:
          CHRONOS_BOLT_TINY_REVISION: a0e552de83495b5c28c14c71c374f3e33280b340
        run: python -m ml.chronos_forecast --probe

      - name: Restore notification state
        uses: actions/cache/restore@v5
        with:
          path: data/notification_state.json
          key: notification-state-${{ github.run_id }}
          restore-keys: |
            notification-state-

      - name: Run notifications
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m ml.notifications

      - name: Save notification state
        uses: actions/cache/save@v5
        if: always() && github.ref_name == 'master'
        with:
          path: data/notification_state.json
          key: notification-state-${{ github.run_id }}

      - name: Record prediction metrics
        continue-on-error: true
        run: python -m ml.metrics --record

      - name: Capture feature-store snapshot
        continue-on-error: true
        run: python -m ml.feature_store

      - name: Commit updated data files
        id: commit
        run: |
          set -e
          git config user.name "gold-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json data/forecast.json data/commentary.json data/drift_metrics.json data/metrics_history.json data/ibja_rates.parquet data/chronos_probe.json data/calibration.json data/feature_store/snapshots.parquet || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update gold prices and forecast [skip ci]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync data via bot PR
        # master requires the "lint" and "pwa-js" status checks (added
        # 2026-07-12), which blocks a direct push from ever landing (a
        # brand-new commit has no checks attached yet, so GH006 rejects it
        # every time — not a flake). This composite action pushes to a bot
        # branch, goes through the same PR gate a human would, and merges
        # once checks pass. No branch-protection change. See its own comments
        # for why it merges explicitly instead of via `gh pr merge --auto`
        # (generate-og-image.yml triggers on this job's completion, so this
        # step blocks until the PR actually lands — otherwise it would
        # screenshot og.html before master has the new price).
        if: steps.commit.outputs.changed == 'true'
        uses: ./.github/actions/bot-pr-sync
        with:
          branch: bot/data-sync
          pr-title: "chore: update gold prices and forecast"
          pr-body: "Automated data sync from Check Gold Price run ${{ github.run_id }}."
          token: ${{ secrets.CI_MERGE_PAT }}
          wait-minutes: "15"

      - name: Alert on stuck bot PR
        # Path-scoped required checks (only requiring lint/pwa-js on code-path
        # PRs, not data-only ones) turned out not to be supported by GitHub —
        # neither classic branch protection nor rulesets support conditioning
        # required_status_checks on changed file paths, and path-filtering the
        # *workflow trigger* itself just leaves the required check pending
        # forever instead of skipping it (GitHub's own troubleshooting docs
        # warn against this). So bot-pr-sync's merge can still fail (a required
        # check genuinely red, not just a mechanism problem) and leave a PR
        # open indefinitely. This runs regardless of the sync step's outcome
        # (always(), not just on failure) so it also catches a PR left over
        # from an earlier run that this run didn't touch (e.g. no new commit
        # this cycle). Read-only — github.token is sufficient, no need for
        # CI_MERGE_PAT.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          PR_JSON=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head bot/data-sync --state open --json number,createdAt --jq '.[0]' 2>/dev/null || echo "")
          if [ -z "$PR_JSON" ] || [ "$PR_JSON" = "null" ]; then
            echo "No open bot/data-sync PR — nothing to check."
            exit 0
          fi
          PR_NUM=$(echo "$PR_JSON" | jq -r '.number')
          CREATED_AT=$(echo "$PR_JSON" | jq -r '.createdAt')
          AGE_MIN=$(( ($(date -u +%s) - $(date -u -d "$CREATED_AT" +%s)) / 60 ))
          echo "bot/data-sync PR #${PR_NUM} has been open for ${AGE_MIN} minutes."
          if [ "$AGE_MIN" -le 30 ]; then
            exit 0
          fi
          if [ -z "${NTFY_TOPIC}" ]; then
            echo "NTFY_TOPIC not set — skipping ntfy alert."
            exit 0
          fi
          curl -s \
            -H "Title: Gold Tracker: bot PR stuck unmerged" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -d "bot/data-sync PR #${PR_NUM} has been open ${AGE_MIN} min without merging -- prices.json may be stale. https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUM}" \
            "https://ntfy.sh/${NTFY_TOPIC}" || true
