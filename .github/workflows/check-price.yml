name: Check Gold Price

on:
  schedule:
    # Every 6 hours, at minute 0 (UTC). India is UTC+5:30, so this fires at
    # 05:30, 11:30, 17:30, 23:30 IST. Adjust if you want different IST times.
    - cron: "0 */6 * * *"
  workflow_dispatch: # allows manual run from the Actions tab

permissions:
  contents: write # needed so the action can commit prices.json back to the repo

concurrency:
  group: gold-price
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci || npm install

      - name: Install Playwright browsers
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      - name: Scrape Tanishq and update prices.json
        working-directory: scraper
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DROP_THRESHOLD: "100"
        run: |
          set -e
          node scrape.js | tee /tmp/reading.json
          cat /tmp/reading.json | node update-and-notify.js

      - name: Commit updated prices.json
        run: |
          git config user.name "gold-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update gold prices [skip ci]"
            git push
          fi
