name: Check Gold Price

on:
  schedule:
    # Every 3 hours, at minute 37, phase-shifted to start at hour 1 (UTC),
    # not minute 7 / hour 0. #1222 (the original minute-of-hour dodge, :00 ->
    # :07) addressed sub-hour queueing at the top of the hour; this is a
    # DIFFERENT claim, addressed here for the first time: an hour-of-day
    # contention specific to the 06:00 UTC slot, not sub-hour timing within
    # it. AD1 (audit 2026-09-10): full available run history (736 scheduled
    # runs, back to 2026-05-17) shows the OLD 06:07 UTC slot delayed
    # (median ~66min, unremarkable) until ~2026-08-30, then abruptly stopped
    # firing as a `schedule` event AT ALL for 9 straight days (2026-09-02
    # through 2026-09-10) -- silently covered by the self-triggered catch-up
    # dispatch this workflow used to carry (removed 2026-09-23: it was firing
    # on ~92% of ticks and closing #1838's checkout-timing fix was meant to
    # retire it outright -- see docs/RUNBOOK.md's "Scheduled-trigger
    # reliability and catch-up" section for the removal note) every single day,
    # each time producing one of the largest gaps in data/run_cadence_log.jsonl
    # (e.g. 2026-09-07 04:22->12:18, a 7.9h gap). Two independent, separately-
    # owned workflows sharing zero code with this one or each other
    # (shadow-fusion.yml here, gg-portfolio's chat-canary.yml) show the same
    # window (their own 06:15/06:00 UTC slots) landing ~255-335min late,
    # essentially every day, continuously since 2026-08-30 (11 days at time
    # of writing) -- not a 4-day blip, not sub-hour jitter. This shifts the
    # whole 8-slot phase by +90min (hour offset 0->1, minute 7->37) so the
    # slot that used to sit at 06:07 UTC now sits at 07:37 UTC, clear of the
    # observed window; IST-window coverage is preserved (see below). Whether
    # this actually helps is a hypothesis, not a fact -- see the PR that
    # introduced this comment for the exact re-measurement to run after 7
    # days of data.
    #
    # GitHub Actions separately documents that scheduled workflows can be
    # delayed or dropped during periods of high load, and "high load times
    # include the start of every hour"
    # (https://docs.github.com/actions/using-workflows/events-that-trigger-workflows#schedule)
    # -- minute 37 keeps clear of that too, same reasoning #1222 established.
    # Fires at ~07:07, 10:07, 13:07, 16:07, 19:07, 22:07, 01:07, 04:07 IST
    # (8 runs/day). T8 morning window 08-14 IST and evening window 18-22 IST
    # each still contain at least one 3h-cadence slot (10:07/13:07 morning,
    # 19:07 evening), so twice-daily digests are unaffected.
    - cron: "37 1-22/3 * * *"
  workflow_dispatch: # allows manual run from the Actions tab
  push:
    branches: [master]
    paths:
      - "ml/inference.py"
      - "ml/features.py"
      - "ml/macro.py"
      - "ml/ibja.py"
      - "ml/chronos_forecast.py"
      - "ml/calibration.py"
      - "ml/notifications.py"
      - "ml/drivers.py"
      - "ml/feature_store.py"
      - "ml/calendar_events.py"
      - ".github/workflows/check-price.yml"
      # scraper/** removed (audit 2026-09, fix/selfhosted-job-cannot-block-
      # schedule): the `check` job here never reads scraper/ code -- that
      # trigger only ever mattered for scrape-tanishq-selfhosted, which now
      # has its own file (scrape-tanishq-selfhosted.yml) with its own
      # scraper/** push trigger.

permissions:
  contents: write # needed so the action can commit prices.json back to the repo
  pull-requests: write # needed to open/auto-merge the data-sync PR (master requires status checks)
  actions: write # needed to dispatch lint.yml explicitly (see note below on GITHUB_TOKEN cascade suppression)

jobs:
  check:
    runs-on: ubuntu-latest
    # Own concurrency group. scrape-tanishq-selfhosted used to live in this
    # same file and was moved to scrape-tanishq-selfhosted.yml (audit 2026-09,
    # fix/selfhosted-job-cannot-block-schedule) specifically so its queue
    # state (a self-hosted runner with no online worker queues for up to 24h)
    # can no longer leave THIS workflow's own run non-completed, which is
    # what let it suppress this job's own next scheduled tick.
    concurrency:
      group: check-price
      cancel-in-progress: false
    # 20min for scrape+ML steps, +15min headroom for the PR auto-merge wait
    # (generate-og-image.yml's workflow_run trigger fires on this job's
    # completion, so it must wait for the data-sync PR to actually merge —
    # otherwise it screenshots stale data).
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tanishq scraping happens in scrape-tanishq-selfhosted.yml (its own
      # workflow file since audit 2026-09) — this job just reads whatever
      # data/prices.json already is on master at
      # checkout time (freshly updated if that job landed a reading recently,
      # last-known otherwise). Same tier-1 freshness gate in
      # ml.inference._select_price_source already handles both cases; no
      # code change needed here.

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements-inference.lock

      - name: Install ML dependencies
        run: |
          pip install -q uv
          uv pip install --system \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r ml/requirements-inference.lock

      - name: Decrypt raw data files (ADR 060)
        # IBJA history and the feature store are committed only as ciphertext. continue-on-error
        # keeps the live forecast updating if this fails (tier 2 needs only today's IBJA rate and
        # the committed calibration.json), and data_crypt.py then refuses to re-encrypt a file it
        # did not decrypt, so a rebuilt-from-nothing parquet can never replace the history. The
        # last step below fails the run so the failure is not silent.
        id: decrypt
        continue-on-error: true
        uses: ./.github/actions/decrypt-data
        with:
          key: ${{ secrets.DATA_ENC_KEY }}

      - name: Fetch macro features
        continue-on-error: true
        run: python ml/macro.py

      - name: Check macro cache age
        run: |
          python3 -c '
          import json, sys
          from pathlib import Path
          status_path = Path("data/macro_status.json")
          if not status_path.exists():
              print("macro_status.json not found -- skipping age check")
              sys.exit(0)
          status = json.loads(status_path.read_text())
          age = status.get("cache_age_days")
          fail_threshold = status.get("fail_threshold_days", 14)
          if age is None:
              print("Macro cache does not exist -- skipping age check")
              sys.exit(0)
          print(f"Macro cache age: {age:.2f} days (fail threshold: {fail_threshold}d)")
          fc_path = Path("data/forecast.json")
          if fc_path.exists():
              try:
                  fc = json.loads(fc_path.read_text())
                  fc["macro_cache_age_days"] = age
                  fc_path.write_text(json.dumps(fc, indent=2) + "\n")
                  print(f"Patched macro_cache_age_days={age} into forecast.json")
              except Exception as e:
                  print(f"Warning: could not patch forecast.json: {e}")
          if age > fail_threshold:
              print(f"ERROR: Macro cache is {age:.1f} days old (>{fail_threshold}d). Macro features are stale.")
              sys.exit(1)
          '

      - name: Check forecast drift
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DRIFT_THRESHOLD: "1.5"
        run: python -m ml.drift

      - name: Run inference
        continue-on-error: true
        run: python -m ml.inference

      - name: Append IBJA rates
        continue-on-error: true
        run: python -m ml.ibja

      - name: Refit calibration if needed
        continue-on-error: true
        run: python -m ml.calibration

      - name: Compute rolling Tanishq scrape success rate
        # H3 (session dated 2026-08-28): reads whatever data/tanishq_scrape_
        # outcomes.jsonl already is on master at checkout time (same "read
        # whatever's committed" pattern this job already uses for prices.json
        # itself -- see the comment at the top of this job) -- no dependency
        # on scrape-tanishq-selfhosted having run in this same workflow
        # trigger. Feeds README's injected scrape-success-rate metric.
        continue-on-error: true
        run: python -m ml.scrape_metrics

      - name: Cache Chronos model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: chronos-bolt-tiny-${{ env.CHRONOS_BOLT_TINY_REVISION }}
        env:
          CHRONOS_BOLT_TINY_REVISION: a0e552de83495b5c28c14c71c374f3e33280b340

      - name: Run Chronos probe
        continue-on-error: true
        env:
          CHRONOS_BOLT_TINY_REVISION: a0e552de83495b5c28c14c71c374f3e33280b340
        run: python -m ml.chronos_forecast --probe

      - name: Restore notification state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/notification_state.json
          key: notification-state-${{ github.run_id }}
          restore-keys: |
            notification-state-

      - name: Run notifications
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Public price digests go here (allowlisted trigger ids only, see ml/notification_routing.py).
          # Unset or empty: they fall back to NTFY_TOPIC, so nothing is dropped while it is being set up.
          NTFY_TOPIC_PUBLIC: ${{ secrets.NTFY_TOPIC_PUBLIC }}
        run: python -m ml.notifications

      - name: Save notification state
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && github.ref_name == 'master'
        with:
          path: data/notification_state.json
          key: notification-state-${{ github.run_id }}

      - name: Record prediction metrics
        continue-on-error: true
        run: python -m ml.metrics --record

      - name: Compute rolling data-cadence metric
        # R2 (audit 2026-09-04): feeds README's injected cadence claim
        # (scripts/inject_metrics.py marker) and the PWA's i18n.js cadence
        # text (app.js fetches this step's output, data/cadence_metrics.json,
        # directly). Reads data/run_cadence_log.jsonl, appended to by THIS
        # run's own "Commit updated data files" step below -- so this metric
        # reflects every commit up to and including the PREVIOUS run, not
        # this one (which hasn't committed yet when this step runs). One run
        # of lag is fine for a rolling weekly median.
        continue-on-error: true
        run: python -m ml.cadence_metrics

      - name: Capture feature-store snapshot
        continue-on-error: true
        run: python -m ml.feature_store

      - name: Re-encrypt raw data files (ADR 060)
        # Before the migration PR lands both paths are still tracked plaintext and this is a
        # no-op; afterwards it re-encrypts only a file whose plaintext changed.
        id: seal
        continue-on-error: true
        env:
          DATA_ENC_KEY: ${{ secrets.DATA_ENC_KEY }}
        run: python scripts/data_crypt.py encrypt data/ibja_rates.parquet data/feature_store/snapshots.parquet

      - name: Commit updated data files
        id: commit
        env:
          DATA_ENC_KEY: ${{ secrets.DATA_ENC_KEY }}
        run: |
          set -e
          git config user.name "gold-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          # ibja_rates.parquet and feature_store/snapshots.parquet are added as plaintext only while
          # still tracked (pre-migration). Once migrated they are gitignored, git refuses them
          # (covered by `|| true`), and data/encrypted/ carries them instead. ADR 060.
          git add data/forecast.json data/drift_metrics.json data/metrics_history.json data/ibja_rates.parquet data/chronos_probe.json data/calibration.json data/feature_store/snapshots.parquet data/tanishq_scrape_success_rate.json data/cadence_metrics.json || true
          git add data/encrypted/ || true
          # Fails the commit if the key, or its base64/hex form, is in any file about to be committed.
          python scripts/data_crypt.py scan-key --changed
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            # R2 (audit 2026-09-04): one line per actual successful data
            # commit -- ml.cadence_metrics reads this to compute the real
            # observed interval between commits (feeds README's injected
            # cadence claim and the PWA's i18n.js cadence text), not the
            # nominal 3h cron value, which stopped being accurate once
            # scheduled-trigger reliability degraded (see docs/RUNBOOK.md).
            echo "{\"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" >> data/run_cadence_log.jsonl
            git add data/run_cadence_log.jsonl
            git commit -m "chore: update gold prices and forecast [skip ci]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync data via bot PR
        # master requires the "lint" and "pwa-js" status checks (added
        # 2026-07-12), which blocks a direct push from ever landing (a
        # brand-new commit has no checks attached yet, so GH006 rejects it
        # every time — not a flake). This composite action pushes to a bot
        # branch, goes through the same PR gate a human would, and merges
        # once checks pass. No branch-protection change. See its own comments
        # for why it merges explicitly instead of via `gh pr merge --auto`
        # (generate-og-image.yml triggers on this job's completion, so this
        # step blocks until the PR actually lands — otherwise it would
        # screenshot og.html before master has the new price).
        if: steps.commit.outputs.changed == 'true'
        uses: ./.github/actions/bot-pr-sync
        with:
          branch: bot/data-sync
          pr-title: "chore: update gold prices and forecast"
          pr-body: "Automated data sync from Check Gold Price run ${{ github.run_id }}."
          token: ${{ secrets.CI_MERGE_PAT }}
          wait-minutes: "15"
          ntfy-topic: ${{ secrets.NTFY_TOPIC }}

      - name: Alert on stuck bot PR
        # Path-scoped required checks (only requiring lint/pwa-js on code-path
        # PRs, not data-only ones) turned out not to be supported by GitHub —
        # neither classic branch protection nor rulesets support conditioning
        # required_status_checks on changed file paths, and path-filtering the
        # *workflow trigger* itself just leaves the required check pending
        # forever instead of skipping it (GitHub's own troubleshooting docs
        # warn against this). So bot-pr-sync's merge can still fail (a required
        # check genuinely red, not just a mechanism problem) and leave a PR
        # open indefinitely. This runs regardless of the sync step's outcome
        # (always(), not just on failure) so it also catches a PR left over
        # from an earlier run that this run didn't touch (e.g. no new commit
        # this cycle). Read-only — github.token is sufficient, no need for
        # CI_MERGE_PAT.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          PR_JSON=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head bot/data-sync --state open --json number,createdAt --jq '.[0]' 2>/dev/null || echo "")
          if [ -z "$PR_JSON" ] || [ "$PR_JSON" = "null" ]; then
            echo "No open bot/data-sync PR — nothing to check."
            exit 0
          fi
          PR_NUM=$(echo "$PR_JSON" | jq -r '.number')
          CREATED_AT=$(echo "$PR_JSON" | jq -r '.createdAt')
          AGE_MIN=$(( ($(date -u +%s) - $(date -u -d "$CREATED_AT" +%s)) / 60 ))
          echo "bot/data-sync PR #${PR_NUM} has been open for ${AGE_MIN} minutes."
          if [ "$AGE_MIN" -le 30 ]; then
            exit 0
          fi
          if [ -z "${NTFY_TOPIC}" ]; then
            echo "NTFY_TOPIC not set — skipping ntfy alert."
            exit 0
          fi
          curl -s \
            -H "Title: Gold Tracker: bot PR stuck unmerged" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -d "bot/data-sync PR #${PR_NUM} has been open ${AGE_MIN} min without merging -- prices.json may be stale. https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUM}" \
            "https://ntfy.sh/${NTFY_TOPIC}" || true

      - name: Fail the run if decrypt or re-encrypt failed (ADR 060)
        if: always() && (steps.decrypt.outcome == 'failure' || steps.seal.outcome == 'failure')
        run: |
          echo "::error title=Raw data decrypt/encrypt failed::decrypt=${{ steps.decrypt.outcome }} seal=${{ steps.seal.outcome }}. The forecast was still committed; the encrypted history was left unchanged. See docs/adr/060-encrypted-raw-data.md (recovery)."
          exit 1
