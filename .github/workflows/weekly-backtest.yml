name: Weekly Backtest

on:
  schedule:
    - cron: "0 2 * * 0" # Sunday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write # needed to open/auto-merge the backtest-sync PR (master requires status checks)
  actions: write # needed to dispatch lint.yml explicitly (GITHUB_TOKEN pushes/PRs don't auto-trigger it)

concurrency:
  group: gold-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40 # 30 for the backtest itself + 10 headroom for the bot-pr-sync wait

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements-inference.lock

      - name: Install ML dependencies
        run: |
          pip install -q uv
          uv pip install --system \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r ml/requirements-inference.lock

      - name: Cache Chronos model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: chronos-bolt-tiny-${{ env.CHRONOS_BOLT_TINY_REVISION }}
        env:
          CHRONOS_BOLT_TINY_REVISION: a0e552de83495b5c28c14c71c374f3e33280b340

      - name: Run walk-forward backtest
        run: python -m ml.backtest --run

      - name: Run integration tests (non-gating)
        # @pytest.mark.integration tests make live HuggingFace calls — excluded from the
        # gating Lint suite (norm #11). Chronos weights are already cached by the step
        # above. continue-on-error: true so a HuggingFace outage never blocks the gate,
        # but a genuine model/pin regression still appears in workflow logs.
        continue-on-error: true
        run: pytest -m "integration" tests/ -v

      - name: Resolve metrics outcomes
        continue-on-error: true
        run: python -m ml.metrics --resolve

      - name: Commit backtest results
        id: commit
        run: |
          set -e
          git config user.name "gold-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest.json data/metrics_history.json data/coverage_metrics.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update backtest results [skip ci]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync backtest results via bot PR
        # master requires "lint"+"pwa-js" status checks — see the composite
        # action for the full writeup on why this can't be a direct push.
        if: steps.commit.outputs.changed == 'true'
        uses: ./.github/actions/bot-pr-sync
        with:
          branch: bot/backtest-sync
          pr-title: "chore: update backtest results"
          pr-body: "Automated backtest sync from Weekly Backtest run ${{ github.run_id }}."
          token: ${{ secrets.CI_MERGE_PAT }}
          wait-minutes: "10"
