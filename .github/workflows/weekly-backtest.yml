name: Weekly Backtest

on:
  schedule:
    - cron: "0 2 * * 0" # Sunday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements.txt

      - name: Install ML dependencies
        run: pip install -q -r ml/requirements.txt

      - name: Run walk-forward backtest
        run: python ml/backtest.py

      - name: Commit backtest results
        run: |
          git config user.name "gold-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update backtest results [skip ci]"
            git push
          fi
