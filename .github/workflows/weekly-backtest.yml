name: Weekly Backtest

on:
  schedule:
    - cron: "0 2 * * 0" # Sunday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write # needed to open/auto-merge the backtest-sync PR (master requires status checks)
  actions: write # needed to dispatch lint.yml explicitly (GITHUB_TOKEN pushes/PRs don't auto-trigger it)

concurrency:
  group: gold-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements-inference.lock

      - name: Install ML dependencies
        run: |
          pip install -q uv
          uv pip install --system \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r ml/requirements-inference.lock

      - name: Cache Chronos model weights
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: chronos-bolt-tiny-${{ env.CHRONOS_BOLT_TINY_REVISION }}
        env:
          CHRONOS_BOLT_TINY_REVISION: a0e552de83495b5c28c14c71c374f3e33280b340

      - name: Run walk-forward backtest
        run: python -m ml.backtest --run

      - name: Run integration tests (non-gating)
        # @pytest.mark.integration tests make live HuggingFace calls — excluded from the
        # gating Lint suite (norm #11). Chronos weights are already cached by the step
        # above. continue-on-error: true so a HuggingFace outage never blocks the gate,
        # but a genuine model/pin regression still appears in workflow logs.
        continue-on-error: true
        run: pytest -m "integration" tests/ -v

      - name: Resolve metrics outcomes
        continue-on-error: true
        run: python -m ml.metrics --resolve

      - name: Commit backtest results
        # master requires "lint"+"pwa-js" status checks that a fresh bot
        # commit can never have attached before a direct push is evaluated
        # (GH006, rejected every time — see check-price.yml for the full
        # writeup). Route through a bot branch + PR + auto-merge instead;
        # workflow_dispatch is exempt from GITHUB_TOKEN's cascade-trigger
        # suppression, so we dispatch lint.yml ourselves to get the check
        # runs the PR needs. No branch-protection change.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "gold-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest.json data/metrics_history.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update backtest results [skip ci]"

          # Rebase onto latest master first — it can move between this job's
          # checkout and this step, and a branch that starts behind can't
          # satisfy required-status-checks' "strict" rule even after checks pass.
          git fetch origin master
          git rebase origin/master
          git push --force origin "HEAD:refs/heads/bot/backtest-sync"

          if ! gh pr view bot/backtest-sync --json number >/dev/null 2>&1; then
            gh pr create --base master --head bot/backtest-sync \
              --title "chore: update backtest results" \
              --body "Automated backtest sync from Weekly Backtest run ${GITHUB_RUN_ID}. Auto-merges once lint + pwa-js pass."
          fi

          gh workflow run lint.yml --ref bot/backtest-sync
          gh pr merge bot/backtest-sync --auto --squash
