name: Direction Signal Eval

# Re-runs the walk-forward directional evaluation (ml.direction.evaluate) so the
# model self-measures as the feature store grows. The signal stays DARK until a
# model clears the always-up base rate out-of-sample with significance (the gate
# in ml/direction/gate.py). This workflow only MEASURES and records — it never
# ships a user-facing claim. See ADR 019.
on:
  schedule:
    # Weekly, Monday 04:00 UTC. The feature store grows ~1 row/day, so a weekly
    # cadence is plenty to track the trend toward a regime where a signal could
    # clear the baseline (~300 rows, est. 2027).
    - cron: "0 4 * * 1"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "ml/direction/**"
      - ".github/workflows/eval-direction.yml"

permissions:
  contents: write # commit the refreshed direction_baseline.json + history log
  pull-requests: write # needed to open/auto-merge the direction-eval-sync PR (master requires status checks)
  actions: write # needed to dispatch lint.yml explicitly (GITHUB_TOKEN pushes/PRs don't auto-trigger it)

concurrency:
  group: eval-direction
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements-inference.lock

      - name: Install ML dependencies
        run: |
          pip install -q uv
          uv pip install --system \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r ml/requirements-inference.lock

      - name: Run walk-forward direction eval
        run: python -m ml.direction.evaluate

      - name: Commit refreshed eval results
        # master requires "lint"+"pwa-js" status checks that a fresh bot
        # commit can never have attached before a direct push is evaluated
        # (GH006, rejected every time — see check-price.yml for the full
        # writeup). Route through a bot branch + PR + auto-merge instead;
        # workflow_dispatch is exempt from GITHUB_TOKEN's cascade-trigger
        # suppression, so we dispatch lint.yml ourselves to get the check
        # runs the PR needs. No branch-protection change.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "gold-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/direction_baseline.json data/direction_eval_history.jsonl || true
          if git diff --staged --quiet; then
            echo "No eval changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh direction eval results [skip ci]"

          # Rebase onto latest master first — it can move between this job's
          # checkout and this step, and a branch that starts behind can't
          # satisfy required-status-checks' "strict" rule even after checks pass.
          git fetch origin master
          git rebase origin/master
          git push --force origin "HEAD:refs/heads/bot/direction-eval-sync"

          if ! gh pr view bot/direction-eval-sync --json number >/dev/null 2>&1; then
            gh pr create --base master --head bot/direction-eval-sync \
              --title "chore: refresh direction eval results" \
              --body "Automated direction-eval sync from Direction Signal Eval run ${GITHUB_RUN_ID}. Auto-merges once lint + pwa-js pass."
          fi

          gh workflow run lint.yml --ref bot/direction-eval-sync
          gh pr merge bot/direction-eval-sync --auto --squash
