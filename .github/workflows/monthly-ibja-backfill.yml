name: Monthly IBJA PDF Backfill

# Runs on the 1st of each month at 04:00 UTC to extend the IBJA parquet with
# the previous 30 days of AM/PM rates from ibjarates.com's rolling PDF archive.
# Kept separate from check-price.yml so the 6h cron is not burdened with the
# extra HTTP fetch + pdfplumber parse on every cycle.
on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch: # allows manual trigger from the Actions tab

permissions:
  contents: write
  pull-requests: write # needed to open/auto-merge the ibja-backfill-sync PR (master requires status checks)
  actions: write # needed to dispatch lint.yml explicitly (GITHUB_TOKEN pushes/PRs don't auto-trigger it)

concurrency:
  group: monthly-ibja-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements-inference.lock

      - name: Install ML dependencies
        run: |
          pip install -q uv
          uv pip install --system \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r ml/requirements-inference.lock

      - name: Run IBJA PDF backfill
        continue-on-error: true
        run: python -m ml.ibja backfill

      - name: Commit updated parquet
        # master requires "lint"+"pwa-js" status checks that a fresh bot
        # commit can never have attached before a direct push is evaluated
        # (GH006, rejected every time — see check-price.yml for the full
        # writeup). Route through a bot branch + PR + auto-merge instead;
        # workflow_dispatch is exempt from GITHUB_TOKEN's cascade-trigger
        # suppression, so we dispatch lint.yml ourselves to get the check
        # runs the PR needs. No branch-protection change.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "gold-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ibja_rates.parquet 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No new IBJA rows to commit."
            exit 0
          fi

          git commit -m "chore: monthly IBJA PDF backfill [skip ci]"

          # Rebase onto latest master first — it can move between this job's
          # checkout and this step, and a branch that starts behind can't
          # satisfy required-status-checks' "strict" rule even after checks pass.
          git fetch origin master
          git rebase origin/master
          git push --force origin "HEAD:refs/heads/bot/ibja-backfill-sync"

          if ! gh pr view bot/ibja-backfill-sync --json number >/dev/null 2>&1; then
            gh pr create --base master --head bot/ibja-backfill-sync \
              --title "chore: monthly IBJA PDF backfill" \
              --body "Automated IBJA backfill sync from Monthly IBJA PDF Backfill run ${GITHUB_RUN_ID}. Auto-merges once lint + pwa-js pass."
          fi

          gh workflow run lint.yml --ref bot/ibja-backfill-sync
          gh pr merge bot/ibja-backfill-sync --auto --squash
