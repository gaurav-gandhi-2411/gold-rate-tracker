name: Monthly IBJA PDF Backfill

# Runs on the 1st of each month at 04:00 UTC to extend the IBJA parquet with
# the previous 30 days of AM/PM rates from ibjarates.com's rolling PDF archive.
# Kept separate from check-price.yml so the 6h cron is not burdened with the
# extra HTTP fetch + pdfplumber parse on every cycle.
on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch: # allows manual trigger from the Actions tab

permissions:
  contents: write
  pull-requests: write # needed to open/auto-merge the ibja-backfill-sync PR (master requires status checks)
  actions: write # needed to dispatch lint.yml explicitly (GITHUB_TOKEN pushes/PRs don't auto-trigger it)

concurrency:
  group: monthly-ibja-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # 10 for the backfill itself + 10 headroom for the bot-pr-sync wait

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements-inference.lock

      - name: Install ML dependencies
        run: |
          pip install -q uv
          uv pip install --system \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match \
            -r ml/requirements-inference.lock

      - name: Run IBJA PDF backfill
        continue-on-error: true
        run: python -m ml.ibja backfill

      - name: Commit updated parquet
        id: commit
        run: |
          set -e
          git config user.name "gold-rate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ibja_rates.parquet 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No new IBJA rows to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: monthly IBJA PDF backfill [skip ci]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint bot-merge App token
        if: steps.commit.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: gold-rate-tracker

      - name: Sync IBJA parquet via bot PR
        # master requires "lint"+"pwa-js" status checks — see the composite
        # action for the full writeup on why this can't be a direct push.
        if: steps.commit.outputs.changed == 'true'
        uses: ./.github/actions/bot-pr-sync
        with:
          branch: bot/ibja-backfill-sync
          pr-title: "chore: monthly IBJA PDF backfill"
          pr-body: "Automated IBJA backfill sync from Monthly IBJA PDF Backfill run ${{ github.run_id }}."
          token: ${{ steps.app-token.outputs.token }}
          wait-minutes: "10"
