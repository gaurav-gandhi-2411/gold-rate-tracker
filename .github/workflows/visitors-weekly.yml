# Weekly check that the GoatCounter read still works. It sends NOTHING anywhere (2026-11-06: ntfy
# carries gold-price information only, and this repo and its run logs and job summaries are public).
#
# The script still builds the visitor sentence into a file on the runner, but only a status word
# ("counted" or "skipped: reason") reaches the job summary and the ops log. The owner reads the
# visitor numbers directly in GoatCounter. Nothing is uploaded or committed. While the secret is
# missing the run ends green and says so in one line (fails quietly by design).
# Run it from the Monday routine (docs/WEEKLY_ROUTINE.md); the schedule is only a fallback.
name: Visitors weekly

on:
  schedule:
    - cron: "40 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  visitors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # append one line to ops_log.jsonl on the ops-log branch (scripts/ops_log.py)
      actions: read # same as the workflow level; a job block replaces it
    env:
      OPS_LOG_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # monday-push.yml starts this run earlier on Mondays; the fallback cron then must not log a second status.
      - name: Already sent today? (schedule runs only)
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/ci_retry.sh
          TODAY=$(date -u +%Y-%m-%d)
          N=$(ci_retry gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/visitors-weekly.yml/runs?created=${TODAY}&status=success&per_page=50" \
                --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})] | length") || N=0
          echo "earlier successful runs today: ${N}"
          if [ "${N}" -gt 0 ]; then echo "send=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.send != 'false'
        with:
          python-version: "3.12"

      - name: Read the weekly total and top sources
        if: steps.guard.outputs.send != 'false'
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          STATUS=$(python scripts/goatcounter_weekly.py --out "${RUNNER_TEMP}/visitors.txt")
          echo "visitor count: ${STATUS}"
          case "${STATUS}" in
            written*) WORD="counted" ;;
            *) WORD="${STATUS}" ;;
          esac
          # a status word only, never a number (the repo is public); the owner reads GoatCounter directly
          {
            echo "### Visitors weekly"
            echo
            echo "status: ${WORD}. Visitor numbers are not posted here: read them in GoatCounter."
          } >> "${GITHUB_STEP_SUMMARY}"
          case "${WORD}" in
            skipped*)
              python scripts/ops_log.py --source "visitors-weekly" --title "visitor count ${WORD%%:*}" \
                --body "${WORD}. Read the visitor numbers in GoatCounter directly." || true ;;
          esac
          rm -f "${RUNNER_TEMP}/visitors.txt"
