name: Scraper DOM Canary

on:
  schedule:
    - cron: "0 3 * * 1" # Monday 03:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "scraper/**"
      - "tests/fixtures/tanishq_sample.html"
      - "tests/fixtures/cf_challenge.html"

permissions:
  contents: read
  issues: write

concurrency:
  group: scraper-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci || npm install

      - name: Install Playwright browsers
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      - name: Run fixture DOM tests
        working-directory: scraper
        run: node --test test_scrape.js

      - name: Run scraper hardening tests (mock HTTP, no live network)
        working-directory: scraper
        run: node --test test_scraper_hardening.mjs

      - name: Run hybrid-scrape tests (mock HTTP + Playwright fallback, Φ24)
        working-directory: scraper
        run: node --test test_hybrid_scrape.mjs

      - name: Run update-and-notify jump-guard tests
        working-directory: scraper
        run: node --test test_update_and_notify.js

      - name: Live DOM canary (Tanishq page)
        id: canary
        # Live network call — skip on pull_request to avoid external dependency in PR CI.
        # Hardening tests (above) cover all mock-testable failure modes on every PR.
        if: github.event_name != 'pull_request'
        working-directory: scraper
        # scrape.js exit codes distinguish an IP-level Cloudflare block (2) — the
        # documented expected steady state per ADR 025, see docs/RUNBOOK.md's
        # "Scraper DOM canary issues" note — from a genuine DOM/selector break (1).
        # A CF block is recorded as a step output but does NOT fail the step, so
        # it never reaches the alert step below; only a real break does. Without
        # this split, every canary run this repo has ever seen fail was actually
        # a runner-IP CF block (see #577), and the alert/issue text below always
        # claimed "the DOM may have changed" regardless — a control crying wolf
        # on its most common failure mode.
        run: |
          set +e
          node scrape.js > /dev/null 2> /tmp/canary_stderr.log
          code=$?
          set -e
          cat /tmp/canary_stderr.log
          if [ "$code" -eq 2 ]; then
            echo "::warning::Scraper canary blocked by Cloudflare (expected steady-state per ADR 025) — not a DOM change. Not alerting."
            echo "cf_block=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      - name: Alert on canary failure
        if: failure() && steps.canary.outcome == 'failure'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # ntfy alert — ASCII-only headers
          [ -z "${NTFY_TOPIC}" ] && echo "NTFY_TOPIC not set — skipping ntfy alert." || \
          curl -s \
            -H "Title: Gold Tracker: Scraper DOM broken" \
            -H "Priority: urgent" \
            -H "Tags: rotating_light" \
            -d "Tanishq DOM canary failed with a non-Cloudflare error -- the selector or page structure likely changed. Check: ${RUN_URL}" \
            "https://ntfy.sh/${NTFY_TOPIC}" || true

          # Open a GitHub issue so it doesn't get lost
          gh issue create \
            --repo "${REPO}" \
            --title "Scraper DOM canary failed $(date -u +%Y-%m-%d)" \
            --body "The weekly scraper DOM canary failed with a non-Cloudflare error. Cloudflare-block
          failures are filtered out before this alert fires (see scraper-canary.yml's canary step and
          scrape.js's isCFBlock exit-code split) -- this means the Tanishq page selector or structure
          most likely actually changed.

          **Run:** ${RUN_URL}

          **What to check:**
          1. Open https://www.tanishq.co.in/gold-rate.html and inspect \`span.goldpurity-rate[data-goldrate22kt]\`
          2. Check if the page redirects or requires login
          3. Verify gold prices are in range (2000–25000 INR/g)
          4. Update \`scraper/scrape.js\` selector if needed

          See \`docs/RUNBOOK.md\` for full resolution steps." \
            --label "bug" || true
