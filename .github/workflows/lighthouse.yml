name: Lighthouse

# Authoritative, reproducible Lighthouse mobile performance/CLS measurement
# against live production, from a GitHub Actions runner. Exists because
# local Lighthouse readings on a dev machine were confirmed unreliable
# (0.116 / 0.2446 / 0.25-0.54 CLS observed on IDENTICAL code across
# different local runs in one session, 2026-08-06) -- an interactive dev
# machine with a browser session, IDE, etc. competing for CPU depresses
# Lighthouse's simulated-throttling numbers in a way that varies run to run.
# A CI runner isn't perfectly quiet either (shared cloud hardware), but it's
# a single-purpose, consistently-sized environment that removes the biggest
# confound -- and every run here is comparable to every other run here,
# which is the actual point: one baseline nobody has to re-argue.
#
# Daily schedule (perf/CLS don't drift minute-to-minute, only when shell
# assets change, which the push trigger below already covers) plus a push
# trigger scoped to the files that are actually served (production is
# GitHub Pages building straight off master -- a push to these paths on
# master IS a deploy, no separate deploy step exists in this repo).

on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "index.html"
      - "style.css"
      - "app.js"
      - "service-worker.js"
      - "manifest.webmanifest"
      - ".github/workflows/lighthouse.yml"
      - "scripts/measure-lighthouse.js"

permissions:
  contents: write # commits reports/lighthouse/*.json + *.md back via bot-pr-sync
  pull-requests: write

concurrency:
  group: lighthouse
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"

      - name: Install Lighthouse
        working-directory: scraper
        run: npm ci

      - name: Run Lighthouse (5x mobile, median)
        run: node scripts/measure-lighthouse.js
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Commit Lighthouse history
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add reports/lighthouse/history.json reports/lighthouse/TREND.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update Lighthouse mobile perf/CLS trend [skip ci]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync data via bot PR
        if: steps.commit.outputs.changed == 'true'
        uses: ./.github/actions/bot-pr-sync
        with:
          branch: bot/lighthouse-sync
          pr-title: "chore: update Lighthouse mobile perf/CLS trend"
          pr-body: "Automated Lighthouse mobile measurement from run ${{ github.run_id }}. 5 runs against production, median recorded. No effect on the live site."
          token: ${{ secrets.CI_MERGE_PAT }}
          wait-minutes: "15"
