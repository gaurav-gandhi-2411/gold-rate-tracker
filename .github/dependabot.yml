version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/scraper"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Scraper browser dependencies are NEVER auto-bumped (all update types: no `versions` or
      # `update-types` key means ignore everything). A Playwright bump broke the self-hosted
      # laptop scraper twice: 2026-08 (1.63.0 deleted the working browser cache, #1806 revert)
      # and 2026-10-02 (#1846, install failed for ~11 h, reverted in #2316). A bump here is a
      # deliberate, hand-made PR that must carry a proof run on the self-hosted runner
      # (scripts/check_scraper_dependency_change.py, docs/TANISHQ_TIMED_VISITS.md section 11).
      # Note: this ignores version-update PRs; GitHub security-update PRs may still open and
      # are caught by the same CI gate.
      - dependency-name: "playwright"
      - dependency-name: "playwright-core"
      - dependency-name: "playwright-chromium"
      - dependency-name: "@playwright/*"
      - dependency-name: "puppeteer*"
      - dependency-name: "chromium*"
      - dependency-name: "@sparticuz/chromium*"

  - package-ecosystem: "pip"
    directory: "/ml"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # numpy 2.5.0+ requires Python >=3.12, but lint.yml's "Install ML
      # dependencies" step installs ml/requirements.txt directly under
      # Python 3.11 (separate from ml/requirements-inference.lock, which
      # IS generated for 3.12 but only consumed by `make setup-inference`,
      # not CI). A numpy>=2.5.x floor bump breaks that install step every
      # time dependabot proposes it (confirmed 2026-08-11, PR #785) until
      # lint.yml's Python version and this floor move together. Remove
      # this ignore rule if/when lint.yml bumps off 3.11.
      - dependency-name: "numpy"
        versions: [">=2.5.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
