repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=10240']  # 10 MB cap
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        # CI runs pre-commit on Python 3.11 (lint.yml) and pyproject sets mypy python_version = "3.11".
        # Without this, a 3.12 interpreter builds the hook env and pulls numpy stubs that use the 3.12
        # `type` statement, which mypy rejects for a 3.11 target, so mypy failed locally only.
        language_version: python3.11
        files: ^ml/
        additional_dependencies:
          - types-pyyaml
          - types-requests
          - pandas-stubs

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
