repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=10240']  # 10 MB cap
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^ml/
        # Pinned: unpinned, pandas-stubs 3.1.0.261029 (PyPI 2026-10-29 17:09Z) turned mypy red on
        # every bot PR, so no data sync could merge and the live page froze. Bump on purpose, in a PR.
        additional_dependencies:
          - types-pyyaml==6.0.12.20260906
          - types-requests==2.33.0.20261006
          - pandas-stubs==3.0.5.260914

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
